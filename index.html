<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salmon Rivers Intelligence 10042</title>
<style>
body{margin:0;font-family:system-ui;background:#06110f;color:#eef8f4}
header{padding:14px;border-bottom:1px solid #25483f;background:#071814}
h1{margin:0;font-size:20px}
.sub{font-size:12px;color:#9fb8af}
main{padding:14px;max-width:800px;margin:auto}
.card{background:#0f211d;border:1px solid #25483f;border-radius:14px;padding:12px}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px;margin-bottom:8px;background:#132a24;border-radius:10px}
.name{font-weight:800;font-size:16px}
.meta{font-size:11px;color:#9fb8af}
.level{font-size:20px;font-weight:900}
.arrow{font-size:20px;font-weight:900}
.up{color:#72e6b1}.flat{color:#7dd3fc}.down{color:#ffd166}
.tidal{color:#ffd166;font-size:11px;font-weight:800}
.status{font-size:12px;color:#9fb8af;margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>Ribble — Live Data</h1>
  <div class="sub">build 10042 · data only · no recommendations</div>
</header>

<main>
<div class="card">

<div class="row">
  <div><div class="name">Henthorn</div><div class="meta">710305</div></div>
  <div class="level" id="l1">—</div>
  <div class="arrow" id="a1">·</div>
</div>

<div class="row">
  <div><div class="name">Low Moor</div><div class="meta">710301</div></div>
  <div class="level" id="l2">—</div>
  <div class="arrow" id="a2">·</div>
</div>

<div class="row">
  <div><div class="name">Ribchester</div><div class="meta">713040</div></div>
  <div class="level" id="l3">—</div>
  <div class="arrow" id="a3">·</div>
</div>

<div class="row">
  <div><div class="name">Samlesbury</div><div class="meta">713019</div></div>
  <div class="level" id="l4">—</div>
  <div class="arrow" id="a4">·</div>
</div>

<div class="row">
  <div><div class="name">Penwortham</div><div class="meta">713354 · tidal</div></div>
  <div class="level" id="l5">—</div>
  <div class="arrow tidal">tidal</div>
</div>

<div class="status" id="status">Loading…</div>

</div>
</main>

<script>
const EA = "https://environment.data.gov.uk/flood-monitoring";

const gauges = [
  {id:"710305", level:"l1", arrow:"a1"},
  {id:"710301", level:"l2", arrow:"a2"},
  {id:"713040", level:"l3", arrow:"a3"},
  {id:"713019", level:"l4", arrow:"a4"},
  {id:"713354", level:"l5", arrow:null}
];

function arrow(diff){
  if(diff === null) return "·";
  if(Math.abs(diff) < 0.01) return "→";
  return diff > 0 ? "↑" : "↓";
}

async function loadGauge(g){
  try{
    const r = await fetch(`${EA}/id/stations/${g.id}/readings?_sorted&_limit=5`, {cache:"no-store"});
    const d = await r.json();
    const items = d.items || [];
    if(!items.length) return;

    const now = Number(items[0].value);
    const prev = Number(items[items.length-1].value);
    const diff = now - prev;

    document.getElementById(g.level).textContent = now.toFixed(2) + "m";

    if(g.arrow){
      const el = document.getElementById(g.arrow);
      const ar = arrow(diff);
      el.textContent = ar;
      el.className = "arrow " + (ar==="↑" ? "up" : ar==="↓" ? "down" : "flat");
    }
  }catch(e){
    document.getElementById(g.level).textContent = "—";
  }
}

function init(){
  gauges.forEach(loadGauge);
  document.getElementById("status").textContent =
    "Live EA data · refreshed " + new Date().toLocaleTimeString();
}

init();
</script>
</body>
</html>
