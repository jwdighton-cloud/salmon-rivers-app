<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ribble Henthorn Intelligence</title>

<style>
body {font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f5f6f7;color:#111;}
h1 {text-align:center;margin:20px 0 8px 0;font-size:26px;}
.build {text-align:center;font-size:14px;color:#666;margin-bottom:12px;}
.container {max-width:620px;margin:auto;padding:10px;}
.card {background:#fff;border-radius:22px;padding:16px;margin-bottom:18px;box-shadow:0 4px 10px rgba(0,0,0,0.06);}
.section {background:#f0f0f0;border-radius:16px;padding:12px;margin-top:12px;}
.section h3 {margin:0 0 8px;}
.big-level {font-size:42px;font-weight:800;margin:8px 0;}
.pill {display:inline-block;padding:7px 12px;border-radius:20px;background:#ddd;margin:4px 4px 4px 0;}
.good {background:#c8e6c9;}
.ok {background:#fff3cd;}
.bad {background:#ffcdd2;}
.small {font-size:13px;color:#555;line-height:1.5;}
.advice {font-size:16px;line-height:1.45;margin-top:8px;}
a {text-decoration:none;color:#1a0dab;font-weight:600;}
</style>
</head>

<body>

<h1>Ribble @ Henthorn</h1>
<div class="build">Build: 10041 — refined Henthorn logic</div>

<div class="container" id="content"></div>

<script>
const HENTHORN_URL = "https://environment.data.gov.uk/flood-monitoring/id/stations/710305/readings?_sorted&_limit=12";

async function getHenthornData() {
  try {
    const res = await fetch(HENTHORN_URL, { cache: "no-store" });
    const data = await res.json();

    if (!data.items || data.items.length === 0) {
      return { level:null, time:null, trend:"Unavailable", change:null };
    }

    const readings = data.items
      .map(r => ({ value:Number(r.value), time:r.dateTime }))
      .filter(r => !isNaN(r.value))
      .sort((a,b) => new Date(b.time) - new Date(a.time));

    const latest = readings[0];
    const oldest = readings[readings.length - 1];
    const diff = latest.value - oldest.value;

    let trend = "Steady";
    if (diff > 0.12) trend = "Rising fast";
    else if (diff > 0.04) trend = "Rising";
    else if (diff < -0.12) trend = "Falling fast";
    else if (diff < -0.04) trend = "Falling";

    return {
      level: latest.value,
      time: latest.time,
      trend: trend,
      change: diff
    };

  } catch (e) {
    return { level:null, time:null, trend:"Unavailable", change:null };
  }
}

function getDecision(level, trend) {
  if (level === null) {
    return {
      label:"Unknown",
      cls:"ok",
      verdict:"Live Henthorn level unavailable.",
      advice:"Refresh the app or check the GOV.UK Henthorn gauge."
    };
  }

  if (level < 0.25) {
    return {
      label:"Poor",
      cls:"bad",
      verdict:"Very low.",
      advice:"Likely thin, clear, and difficult. Better to wait for fresh water."
    };
  }

  if (level < 0.35) {
    if (trend === "Rising" || trend === "Rising fast") {
      return {
        label:"Watch",
        cls:"ok",
        verdict:"Low, but lifting.",
        advice:"Not ideal yet, but worth watching. If rain continues, conditions may improve."
      };
    }

    return {
      label:"Poor",
      cls:"bad",
      verdict:"Low.",
      advice:"Fish may be present, but conditions are likely hard. Best with cloud, cooler water, or very fresh fish."
    };
  }

  if (level < 0.55) {
    if (trend === "Rising fast") {
      return {
        label:"Watch",
        cls:"ok",
        verdict:"Good height, but rising fast.",
        advice:"Potentially useful, but colour/debris may worsen. Recheck before setting off."
      };
    }

    if (trend === "Falling fast") {
      return {
        label:"Good",
        cls:"good",
        verdict:"Good height, dropping quickly.",
        advice:"A useful window, but it may not last. Fish sooner rather than later."
      };
    }

    return {
      label:"Good",
      cls:"good",
      verdict:"Prime Henthorn range.",
      advice:"Good level and manageable movement. This is the strongest normal window."
    };
  }

  if (level < 0.75) {
    if (trend === "Falling" || trend === "Falling fast") {
      return {
        label:"Good",
        cls:"good",
        verdict:"Good and improving.",
        advice:"A little full but dropping. Often a strong window as the river settles."
      };
    }

    if (trend === "Rising" || trend === "Rising fast") {
      return {
        label:"Watch",
        cls:"ok",
        verdict:"Useful height, but lifting.",
        advice:"Fishable, but watch colour and pace. Recheck trend before travel."
      };
    }

    return {
      label:"Good",
      cls:"good",
      verdict:"Good fishing height.",
      advice:"Slightly fuller than prime low-water height, but very usable if colour is right."
    };
  }

  if (level < 1.00) {
    if (trend === "Falling" || trend === "Falling fast") {
      return {
        label:"Improving",
        cls:"good",
        verdict:"High but coming right.",
        advice:"Could be good as it drops. Focus on slower edges, safer access, and sheltered lies."
      };
    }

    return {
      label:"High",
      cls:"ok",
      verdict:"High but possibly fishable.",
      advice:"Only worth it if colour and access are safe. Not a casual low-water session."
    };
  }

  if (level < 1.25) {
    if (trend === "Falling" || trend === "Falling fast") {
      return {
        label:"Watch",
        cls:"ok",
        verdict:"Still high, but falling.",
        advice:"Probably too much for normal fishing now, but keep watching. It may come good later."
      };
    }

    return {
      label:"Poor",
      cls:"bad",
      verdict:"Too high for normal fishing.",
      advice:"River is carrying too much water. Wait for it to fall and settle."
    };
  }

  return {
    label:"Poor",
    cls:"bad",
    verdict:"Very high.",
    advice:"Do not treat this as a normal fishing window. Wait for a significant drop."
  };
}

function formatTime(dt) {
  if (!dt) return "No timestamp";
  return new Date(dt).toLocaleString("en-GB");
}

function formatChange(change) {
  if (change === null || isNaN(change)) return "Movement unavailable";
  const sign = change > 0 ? "+" : "";
  return sign + change.toFixed(2) + " m";
}

async function render() {
  const content = document.getElementById("content");

  content.innerHTML = `
    <div class="card">
      <h2>Loading live Henthorn data...</h2>
      <div class="section">
        <span class="pill ok">Please wait</span>
      </div>
    </div>
  `;

  const data = await getHenthornData();
  const decision = getDecision(data.level, data.trend);

  content.innerHTML = `
    <div class="card">
      <h2>Today’s Reading</h2>

      <div class="big-level">
        ${data.level !== null ? data.level.toFixed(2) + " m" : "Unavailable"}
      </div>

      <span class="pill ${decision.cls}">${decision.label}</span>
      <span class="pill ok">${data.trend}</span>

      <div class="section">
        <h3>🎯 Decision</h3>
        <div class="advice">
          <strong>${decision.verdict}</strong><br>
          ${decision.advice}
        </div>
      </div>

      <div class="section">
        <h3>📈 Movement</h3>
        <div class="small">
          ${formatChange(data.change)} across recent readings<br>
          Updated: ${formatTime(data.time)}
        </div>
      </div>

      <div class="section">
        <h3>🌡 Temperature</h3>
        <a href="https://www.ribblefisheriesca.co.uk/live-water-quality-monitoring/" target="_blank">
          RFCA Live Water Data
        </a>
      </div>

      <div class="section">
        <h3>🔗 Links</h3>
        <a href="https://check-for-flooding.service.gov.uk/station/5066" target="_blank">
          GOV.UK Henthorn Gauge
        </a>
      </div>
    </div>
  `;
}

render();
</script>

</body>
</html>
