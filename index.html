<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Salmon Rivers</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f5132">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; font-family:Arial; background:#f0f2f5; }

header {
  background:#0f5132;
  color:white;
  padding:15px;
  text-align:center;
  font-size:20px;
}

.container { padding:15px; }

input {
  width:100%;
  padding:12px;
  margin-bottom:15px;
  border-radius:8px;
  border:1px solid #ccc;
}

.tabs {
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.tab {
  flex:1;
  padding:10px;
  text-align:center;
  background:#ddd;
  border-radius:8px;
  cursor:pointer;
}

.tab.active {
  background:#0f5132;
  color:white;
}

.card {
  background:white;
  padding:15px;
  border-radius:10px;
  margin-bottom:12px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.note { margin-top:8px; font-size:14px; color:#555; }
</style>

</head>

<body>

<header>🎣 Salmon Rivers</header>

<div class="container">

<input type="text" id="search" placeholder="Search rivers...">

<div class="tabs">
  <div class="tab active" onclick="setRegion('UK', this)">UK</div>
  <div class="tab" onclick="setRegion('Norway', this)">Norway</div>
  <div class="tab" onclick="setRegion('Iceland', this)">Iceland</div>
</div>

<div id="list"></div>

</div>

<script>

// 🌍 rivers
const rivers = [
  { name:"River Ribble", region:"UK" },
  { name:"River Dee", region:"UK" },
  { name:"River Tay", region:"UK" }
];

let currentRegion = "UK";

// 🔥 live EA data
let ribbleLevel = "loading...";

fetch("https://environment.data.gov.uk/flood-monitoring/id/stations/E70739")
  .then(res => res.json())
  .then(data => {
    const val = data.items.measures[0].latestReading.value;
    ribbleLevel = val + " m";
    render();
  })
  .catch(() => {
    ribbleLevel = "unavailable";
  });

// 🎨 render
function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  rivers
    .filter(r => r.region === currentRegion)
    .forEach(r => {

      let extra = "";

      if (r.name === "River Ribble") {
        extra = `<div class="note">Live EA level: ${ribbleLevel}</div>`;
      }

      list.innerHTML += `
        <div class="card">
          <b>${r.name}</b>
          ${extra}
        </div>
      `;
    });
}

function setRegion(region, el) {
  currentRegion = region;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  el.classList.add("active");
  render();
}

render();

</script>

</body>
</html>
