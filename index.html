<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salmon Rivers</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2f5;
  margin: 0;
  padding: 16px;
}

h1 { 
  text-align: center; 
  margin-bottom: 6px;
}

.subtitle {
  text-align: center;
  font-size: 13px;
  color: #555;
  margin-bottom: 20px;
}

.summary-panel,
.river-card {
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 18px;
  background: white;
  box-shadow: 0 3px 10px rgba(0,0,0,0.12);
}

/* Banner */
.best-banner {
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 18px;
  font-weight: bold;
  line-height: 1.5;
}

.banner-good {
  background: #dff8df;
  border: 2px solid #6ac96a;
}

.banner-check {
  background: #fff6cc;
  border: 2px solid #e0c24a;
}

.banner-avoid {
  background: #ffd6d6;
  border: 2px solid #d66;
}

/* Best river highlight */
.best-card {
  border: 2px solid #6ac96a;
}

.best-label {
  display: inline-block;
  margin-bottom: 10px;
  padding: 6px 10px;
  border-radius: 999px;
  background: #dff8df;
  font-size: 13px;
  font-weight: bold;
}

/* Titles */
.river-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.status { 
  font-size: 30px; 
}

/* Buttons */
.buttons {
  margin-top: 10px;
  margin-bottom: 10px;
}

.buttons button {
  margin-right: 8px;
  margin-top: 8px;
  padding: 10px 14px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-size: 14px;
}

.fish { background: #c8f7c5; }
.check { background: #fff3b0; }
.avoid { background: #f7c5c5; }

/* Info blocks */
.score,
.trend {
  margin-top: 10px;
  padding: 10px;
  border-radius: 12px;
  font-weight: bold;
  background: #f4f6f8;
}

.meta {
  font-size: 12px;
  color: #555;
  margin-top: 6px;
}

/* History */
.history {
  margin-top: 12px;
  padding: 12px;
  background: #f7f9fb;
  border-radius: 12px;
  font-size: 13px;
}

.history-title {
  font-weight: bold;
  margin-bottom: 6px;
}

.history-item {
  padding: 4px 0;
  border-bottom: 1px solid #e2e6ea;
}

/* Notes */
textarea {
  width: 100%;
  box-sizing: border-box;
  min-height: 80px;
  margin-top: 12px;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 14px;
}
</style>
</head>

<body>

<h1>Salmon Rivers</h1>
<div class="subtitle">Private river intelligence dashboard</div>

<div id="summary"></div>
<div id="app"></div>

<script>
const rivers = [
  { id:"ribble", name:"River Ribble" },
  { id:"tyne", name:"River Tyne" },
  { id:"eden", name:"River Eden" },
  { id:"tweed", name:"River Tweed" },
  { id:"spey", name:"River Spey" },
  { id:"dee", name:"River Dee" },
  { id:"tay", name:"River Tay" },
  { id:"wye", name:"River Wye" }
];

function confidenceFromTime(time) {
  if (!time) return "NO UPDATE";
  const diff = (new Date() - new Date(time)) / (1000 * 60 * 60);
  if (diff > 24) return "LOW";
  if (diff > 6) return "MEDIUM";
  return "HIGH";
}

function statusValue(status) {
  if (status === "🔴") return 1;
  if (status === "🟡") return 2;
  if (status === "🟢") return 3;
  return 0;
}

function confidenceValue(confidence) {
  if (confidence === "HIGH") return 3;
  if (confidence === "MEDIUM") return 2;
  if (confidence === "LOW") return 1;
  return 0;
}

function fishability(status, confidence) {
  if (!status) return "⚪ No decision";
  if (status === "🔴") return "🔴 Avoid";
  if (status === "🟡") return confidence === "HIGH" ? "🟡 Possible" : "🟠 Check";
  if (status === "🟢") return confidence === "HIGH" ? "🟢 Good" : "🟡 Check";
}

function bannerClass(score) {
  if (score.includes("Good")) return "banner-good";
  if (score.includes("Possible") || score.includes("Check")) return "banner-check";
  if (score.includes("Avoid")) return "banner-avoid";
  return "banner-check";
}

function getHistory(id) {
  return JSON.parse(localStorage.getItem(id+"-history")||"[]");
}

function saveHistory(id,status,time){
  const h=getHistory(id);
  h.unshift({status,time});
  localStorage.setItem(id+"-history",JSON.stringify(h.slice(0,3)));
}

function trend(id){
  const h=getHistory(id);
  if(h.length<2)return "⚪ Trend: not enough history";
  const v=s=>s==="🟢"?3:s==="🟡"?2:1;
  if(v(h[0].status)>v(h[1].status))return "📈 Trend: improving";
  if(v(h[0].status)<v(h[1].status))return "📉 Trend: worsening";
  return "➖ Trend: stable";
}

function setStatus(id,status){
  const now=new Date().toLocaleString();
  localStorage.setItem(id+"-status",status);
  localStorage.setItem(id+"-time",now);
  saveHistory(id,status,now);
  render();
}

function snap(r){
  const s=localStorage.getItem(r.id+"-status")||"";
  const t=localStorage.getItem(r.id+"-time");
  const c=confidenceFromTime(t);
  const sc=fishability(s,c);
  const tr=trend(r.id);
  return {
    ...r,
    status:s||"⚪",
    time:t,
    confidence:c,
    score:sc,
    trend:tr,
    rank:(statusValue(s)*10)+(confidenceValue(c)*3)+(tr.includes("improving")?2:tr.includes("worsening")?-1:1)
  };
}

function render(){
  const ranked=rivers.map(snap).sort((a,b)=>b.rank-a.rank);
  const best=ranked[0];

  document.getElementById("summary").innerHTML=`
    <div class="best-banner ${bannerClass(best.score)}">
      ⭐ Best right now: ${best.name}<br>
      ${best.score} · ${best.trend.replace("Trend: ","")} · Confidence: ${best.confidence}
    </div>
  `;

  document.getElementById("app").innerHTML=ranked.map(r=>`
    <div class="river-card ${r.id===best.id?'best-card':''}">
      ${r.id===best.id?'<div class="best-label">⭐ Current #1 river</div>':''}

      <div class="river-title">
        <h2>${r.name}</h2>
        <div class="status">${r.status}</div>
      </div>

      <div class="buttons">
        <button class="fish" onclick="setStatus('${r.id}','🟢')">🟢 Fish</button>
        <button class="check" onclick="setStatus('${r.id}','🟡')">🟡 Check</button>
        <button class="avoid" onclick="setStatus('${r.id}','🔴')">🔴 Avoid</button>
      </div>

      <div class="score">${r.score}</div>
      <div class="trend">${r.trend}</div>

      <div class="meta">
        ${r.time?`Updated: ${r.time} | Confidence: ${r.confidence}`:"No update yet"}
      </div>

      <textarea placeholder="Notes..." oninput="localStorage.setItem('${r.id}-notes',this.value)">
        ${localStorage.getItem(r.id+"-notes")||""}
      </textarea>
    </div>
  `).join("");
}

render();
</script>

</body>
</html>
