<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salmon Rivers</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2f5;
  margin: 0;
  padding: 10px;
}

h1 {
  text-align: center;
}

.river-card {
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 12px;
  background: white;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.status {
  font-size: 24px;
  cursor: pointer;
}

.meta {
  font-size: 12px;
  color: #555;
}

textarea {
  width: 100%;
  margin-top: 8px;
}

.links a {
  margin-right: 10px;
  font-size: 14px;
}

.river-info {
  margin-top: 10px;
  padding: 10px;
  background: #f4f6f8;
  border-radius: 8px;
  font-size: 14px;
}
</style>
</head>

<body>

<h1>Salmon Rivers</h1>

<!-- RIBBLE -->
<div class="river-card">
  <h2>River Ribble</h2>
  <div class="status" onclick="cycleStatus('ribble')">🟢</div>
  <div class="meta" id="ribble-meta"></div>

  <div class="river-info">
    <div><strong>Temp:</strong> <span id="ribble-temp"></span></div>
    <div><strong>Conditions:</strong> <span id="ribble-conditions"></span></div>
    <div><strong>Notes:</strong> <span id="ribble-notes"></span></div>
  </div>

  <textarea id="ribble-notes-input" placeholder="Your notes..."></textarea>

  <div class="links">
    <a href="https://www.google.com/search?q=river+ribble+fishing+report" target="_blank">Reports</a>
    <a href="https://www.bbc.co.uk/weather" target="_blank">Weather</a>
    <a href="https://ribbletrust.org.uk/" target="_blank">RFCA</a>
  </div>
</div>

<!-- TYNE -->
<div class="river-card">
  <h2>River Tyne</h2>
  <div class="status" onclick="cycleStatus('tyne')">🟢</div>
  <div class="meta" id="tyne-meta"></div>

  <div class="river-info">
    <div><strong>Temp:</strong> <span id="tyne-temp"></span></div>
    <div><strong>Conditions:</strong> <span id="tyne-conditions"></span></div>
    <div><strong>Notes:</strong> <span id="tyne-notes"></span></div>
  </div>

  <textarea id="tyne-notes-input" placeholder="Your notes..."></textarea>

  <div class="links">
    <a href="https://www.google.com/search?q=river+tyne+fishing+report" target="_blank">Reports</a>
    <a href="https://www.bbc.co.uk/weather" target="_blank">Weather</a>
  </div>
</div>

<!-- EDEN -->
<div class="river-card">
  <h2>River Eden</h2>
  <div class="status" onclick="cycleStatus('eden')">🟢</div>
  <div class="meta" id="eden-meta"></div>

  <div class="river-info">
    <div><strong>Temp:</strong> <span id="eden-temp"></span></div>
    <div><strong>Conditions:</strong> <span id="eden-conditions"></span></div>
    <div><strong>Notes:</strong> <span id="eden-notes"></span></div>
  </div>

  <textarea id="eden-notes-input" placeholder="Your notes..."></textarea>

  <div class="links">
    <a href="https://www.google.com/search?q=river+eden+fishing+report" target="_blank">Reports</a>
    <a href="https://www.bbc.co.uk/weather" target="_blank">Weather</a>
  </div>
</div>

<script>
const statuses = ["🟢", "🟡", "🔴"];

const riverInfo = {
  ribble: {
    temp: "8–14°C optimal",
    conditions: "Best after a lift and drop",
    notes: "Can colour quickly after rain"
  },
  tyne: {
    temp: "7–13°C optimal",
    conditions: "Strong runs, good in height",
    notes: "Fish move quickly through beats"
  },
  eden: {
    temp: "8–15°C optimal",
    conditions: "Clear water river",
    notes: "Low water = very technical fishing"
  }
};

function cycleStatus(river) {
  const el = document.querySelector(`#${river}-meta`).previousElementSibling;
  let current = statuses.indexOf(el.textContent);
  let next = (current + 1) % statuses.length;
  el.textContent = statuses[next];

  const now = new Date();
  const timeString = now.toLocaleString();

  localStorage.setItem(`${river}-status`, statuses[next]);
  localStorage.setItem(`${river}-time`, timeString);

  updateMeta(river);
}

function updateMeta(river) {
  const time = localStorage.getItem(`${river}-time`);
  if (!time) return;

  const last = new Date(time);
  const now = new Date();
  const diffHours = (now - last) / (1000 * 60 * 60);

  let confidence = "HIGH";
  if (diffHours > 24) confidence = "LOW";
  else if (diffHours > 6) confidence = "MEDIUM";

  document.getElementById(`${river}-meta`).textContent =
    `Updated: ${time} | Confidence: ${confidence}`;
}

function loadRiverInfo() {
  Object.keys(riverInfo).forEach(key => {
    document.getElementById(`${key}-temp`).textContent = riverInfo[key].temp;
    document.getElementById(`${key}-conditions`).textContent = riverInfo[key].conditions;
    document.getElementById(`${key}-notes`).textContent = riverInfo[key].notes;
  });
}

function loadAll() {
  ["ribble","tyne","eden"].forEach(river => {
    const status = localStorage.getItem(`${river}-status`);
    if (status) {
      document.querySelector(`#${river}-meta`).previousElementSibling.textContent = status;
    }

    const notes = localStorage.getItem(`${river}-notes`);
    if (notes) {
      document.getElementById(`${river}-notes-input`).value = notes;
    }

    updateMeta(river);
  });

  loadRiverInfo();
}

document.querySelectorAll("textarea").forEach(el => {
  el.addEventListener("input", e => {
    const id = e.target.id.split("-")[0];
    localStorage.setItem(`${id}-notes`, e.target.value);
  });
});

loadAll();
</script>

</body>
</html>
