<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Salmon Rivers</title>
<link rel="manifest" href="manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family:Arial; background:#f0f2f5; margin:0; }
header { background:#0f5132; color:white; padding:15px; text-align:center; }
.container { padding:15px; }
.card { background:white; padding:15px; margin:10px 0; border-radius:10px; }
.note { font-size:14px; color:#555; margin-top:5px; }
</style>

</head>

<body>

<header>🎣 Salmon Rivers</header>
<div class="container" id="list"></div>

<script>

// Rivers
const rivers = [
  "River Ribble",
  "River Tyne",
  "River Eden"
];

// Fetch real EA data by river name
async function getLevel(river) {
  try {
    const search = river.replace("River ", "");

    const res = await fetch(
      `https://environment.data.gov.uk/flood-monitoring/id/stations?search=${search}`
    );

    const data = await res.json();

    if (!data.items.length) return "not found";

    const station = data.items[0];

    const measureURL = station.measures[0]['@id'];

    const m = await fetch(measureURL);
    const md = await m.json();

    return md.items.latestReading.value + " m";
  } catch {
    return "unavailable";
  }
}

// Render
async function render() {
  const list = document.getElementById("list");
  list.innerHTML = "Loading...";

  let html = "";

  for (let r of rivers) {
    const level = await getLevel(r);

    html += `
      <div class="card">
        <b>${r}</b>
        <div class="note">Live EA level: ${level}</div>
      </div>
    `;
  }

  list.innerHTML = html;
}

render();

</script>

</body>
</html>
