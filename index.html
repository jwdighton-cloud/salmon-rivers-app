<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Salmon Rivers</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">

<style>
body {
  margin:0;
  font-family:Arial, sans-serif;
  background:#f0f2f5;
}
header {
  background:#0f5132;
  color:white;
  padding:15px;
  text-align:center;
  font-size:22px;
}
.container {
  padding:15px;
}
.card {
  background:white;
  padding:15px;
  margin-bottom:12px;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}
.note {
  color:#555;
  font-size:14px;
}
</style>
</head>

<body>

<header>🎣 Salmon Rivers</header>

<div class="container">
  <div class="card">
    <h3>River Ribble</h3>
    <p class="note">Level: rising</p>
    <p class="note">No report yet</p>
  </div>

  <div class="card">
    <h3>River Tyne</h3>
    <p class="note">Level: steady</p>
    <p class="note">No report yet</p>
  </div>

  <div class="card">
    <h3>River Eden</h3>
    <p class="note">Level: falling</p>
    <p class="note">No report yet</p>
  </div>
</div>

</body>
</html>
