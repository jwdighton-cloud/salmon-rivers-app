<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salmon Rivers Intelligence</title>

<style>
body { font-family: Arial; background:#eef2f5; margin:0; padding:16px; }
h1 { text-align:center; }
.tabs { display:flex; gap:8px; margin-bottom:16px; }

.tab {
  flex:1;
  padding:10px;
  border-radius:999px;
  border:none;
  background:white;
  font-weight:bold;
}

.tab.active {
  background:#dff8df;
  border:2px solid #6ac96a;
}

.river-card {
  background:white;
  padding:16px;
  border-radius:16px;
  margin-bottom:16px;
  box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.section {
  background:#f7f9fb;
  padding:12px;
  border-radius:12px;
  margin-top:12px;
}

.badge {
  padding:5px 10px;
  border-radius:999px;
  font-weight:bold;
}

.good { background:#dff8df; }
.check { background:#fff6cc; }
.poor { background:#ffd6d6; }
.unknown { background:#eee; }

.live-value {
  font-size:20px;
  font-weight:bold;
}

.links a {
  display:inline-block;
  margin:6px;
  padding:6px 10px;
  background:#eef2f5;
  border-radius:10px;
  text-decoration:none;
  font-weight:bold;
}

.operator a { background:#e6f9e6; }
.magazine a { background:#fff7d9; }

textarea {
  width:100%;
  margin-top:10px;
  padding:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<h1>Salmon Rivers Intelligence</h1>

<div class="tabs">
  <button class="tab active" onclick="setCountry('UK', this)">🇬🇧 UK</button>
  <button class="tab" onclick="setCountry('Norway', this)">🇳🇴 Norway</button>
  <button class="tab" onclick="setCountry('Iceland', this)">🇮🇸 Iceland</button>
</div>

<div id="app"></div>

<script>
const EA_API = "https://environment.data.gov.uk/flood-monitoring";
let selectedCountry = "UK";

const rivers = [
{
id:"ribble", country:"UK", name:"River Ribble", ea:"Ribble",
operator:[["RFCA","https://ribbletrust.org.uk/"]]
},
{
id:"tyne", country:"UK", name:"River Tyne", ea:"Tyne",
operator:[]
},
{
id:"east_ranga", country:"Iceland", name:"East Rangá",
operator:[["⭐ RIPP Sporting","https://www.rippsporting.com/eastranga"]]
}
];

function setCountry(c, btn){
  selectedCountry=c;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  btn.classList.add("active");
  render();
}

function fishability(value, time){
  if(!value) return {text:"⚪ Unknown", cls:"unknown"};

  const age = (new Date() - new Date(time)) / (1000*60*60);

  if(age < 6) return {text:"🟢 Good", cls:"good"};
  if(age < 24) return {text:"🟡 Check", cls:"check"};

  return {text:"🔴 Poor", cls:"poor"};
}

async function fetchLevel(name){
  const s = await fetch(`${EA_API}/id/stations?riverName=${name}&_limit=10`);
  const d = await s.json();
  const m = d.items?.[0]?.measures?.[0];
  const r = await fetch(m["@id"]+"/readings?_limit=1");
  const rd = await r.json();
  return {
    value: rd.items?.[0]?.value,
    time: rd.items?.[0]?.dateTime
  };
}

async function render(){
  const list = rivers.filter(r=>r.country===selectedCountry);

  document.getElementById("app").innerHTML = list.map(r=>`
    <div class="river-card" id="${r.id}">
      <h2>${r.name}</h2>
      <div class="section">Loading...</div>
    </div>
  `).join("");

  for(const r of list){
    let html = "";

    let data=null;
    if(r.ea){
      try { data = await fetchLevel(r.ea); } catch(e){}
    }

    const f = fishability(data?.value, data?.time);

    html += `
      <div class="section">
        <h3>🎯 Fishability</h3>
        <div class="badge ${f.cls}">${f.text}</div>
      </div>
    `;

    if(data){
      html += `
        <div class="section">
          <h3>📊 Live Data</h3>
          <div class="live-value">${data.value} m</div>
          <div>${new Date(data.time).toLocaleString()}</div>
        </div>
      `;
    }

    html += `
      <div class="section operator">
        <h3>🎣 Operator Intel</h3>
        <div class="links">
          ${r.operator.map(o=>`<a href="${o[1]}" target="_blank">${o[0]}</a>`).join("")}
        </div>
      </div>
    `;

    html += `
      <div class="section magazine">
        <h3>📰 Magazine Intel</h3>
        <div class="links">
          <a href="https://www.google.com/search?q=site:troutandsalmon.com+${r.name}" target="_blank">Trout & Salmon</a>
        </div>
      </div>
    `;

    document.getElementById(r.id).innerHTML = `<h2>${r.name}</h2>` + html;
  }
}

render();
</script>

</body>
</html>
