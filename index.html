<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salmon Rivers Intelligence</title>

<style>
:root{
  --deep:#0b2f3a;
  --river:#0f4c5c;
  --gold:#d9a441;
  --green:#cfead6;
  --blue:#dcecf4;
  --cream:#fff8e7;
  --bg:#edf3f5;
  --card:#ffffff;
  --text:#101820;
  --muted:#607077;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:linear-gradient(180deg,#e6f1f4 0%,#f5f7f8 100%);
  color:var(--text);
}
.app{max-width:680px;margin:auto;padding:16px;}
.header{
  background:linear-gradient(135deg,var(--deep),var(--river));
  color:white;
  border-radius:26px;
  padding:22px 18px;
  margin:8px 0 18px;
  box-shadow:0 10px 24px rgba(15,76,92,.22);
}
.brand{
  font-size:15px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:#d7edf2;
}
.header h1{margin:8px 0 4px;font-size:34px;line-height:1.05;}
.subtitle{color:#cde6ec;font-size:15px;}
.card{
  background:var(--card);
  border-radius:24px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 8px 22px rgba(0,0,0,.07);
}
.card-title{font-size:21px;font-weight:900;margin-bottom:4px;}
.source{color:var(--muted);font-size:13px;margin-bottom:14px;}
.level-wrap{display:flex;align-items:flex-end;gap:8px;margin:6px 0 10px;}
.level{font-size:72px;font-weight:900;letter-spacing:-.05em;line-height:.95;}
.unit{font-size:24px;font-weight:800;color:var(--muted);margin-bottom:7px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;}
.chip{border-radius:999px;padding:8px 12px;font-weight:800;font-size:14px;}
.chip-green{background:var(--green);}
.chip-blue{background:var(--blue);}
.chip-gold{background:var(--cream);color:#7a5600;}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.stat{background:#f2f6f7;border-radius:18px;padding:14px;min-height:82px;}
.stat-label{color:var(--muted);font-size:13px;margin-bottom:6px;}
.stat-value{font-size:21px;font-weight:900;}
.notice{
  background:#fff8e7;
  border-left:5px solid var(--gold);
  border-radius:18px;
  padding:13px 14px;
  color:#4c3b12;
  font-size:14px;
  line-height:1.45;
  margin-top:14px;
}
.fact{
  background:#f2f6f7;
  border-radius:18px;
  padding:14px;
  margin-top:10px;
}
.fact-top{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin-bottom:6px;
}
.fact-tag{
  font-size:12px;
  background:#e4edf0;
  padding:4px 8px;
  border-radius:999px;
  color:#31515b;
  font-weight:900;
  white-space:nowrap;
}
.fact-title{font-size:16px;font-weight:900;margin-bottom:5px;}
.fact-text{font-size:14px;color:#333;line-height:1.45;}
.number-row{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:10px;
}
.mini{
  background:white;
  border-radius:14px;
  padding:10px;
}
.mini-label{font-size:12px;color:var(--muted);}
.mini-value{font-size:22px;font-weight:900;}
.footer{text-align:center;color:var(--muted);font-size:12px;padding:8px 0 20px;}
.loading{color:var(--muted);font-weight:700;}
@media(max-width:480px){
  .header h1{font-size:30px;}
  .level{font-size:64px;}
  .stats{grid-template-columns:1fr 1fr;}
  .number-row{grid-template-columns:1fr;}
}
</style>
</head>

<body>
<div class="app">

<section class="header">
  <div class="brand">Salmon Rivers Intelligence</div>
  <h1>Ribble at Henthorn</h1>
  <div class="subtitle">Live Henthorn level · Ribble-wide salmon facts</div>
</section>

<main id="content">
  <section class="card">
    <div class="card-title">Live Henthorn Conditions</div>
    <div class="source">Loading Environment Agency station 710305...</div>
    <div class="loading">Fetching latest reading</div>
  </section>
</main>

<div class="footer">Gold Build 10045</div>
</div>

<script>
const EA_LATEST =
  "https://environment.data.gov.uk/flood-monitoring/id/stations/710305/readings?latest";
const EA_RECENT =
  "https://environment.data.gov.uk/flood-monitoring/id/stations/710305/readings?_sorted&_limit=12";

async function getJSON(url){
  const r = await fetch(url,{cache:"no-store"});
  if(!r.ok) throw new Error("HTTP " + r.status);
  return await r.json();
}
function formatLevel(v){
  if(v === null || v === undefined || isNaN(v)) return "—";
  return Number(v).toFixed(2);
}
function formatMovement(v){
  if(v === null || v === undefined || isNaN(v)) return "—";
  const sign = v > 0 ? "+" : "";
  return sign + Number(v).toFixed(2) + " m";
}
function ageText(dt){
  if(!dt) return "—";
  const mins = Math.round((Date.now() - new Date(dt)) / 60000);
  if(mins < 1) return "just now";
  if(mins < 60) return mins + " min old";
  return Math.round(mins / 60) + " hr old";
}
function fullTime(dt){
  if(!dt) return "—";
  return new Date(dt).toLocaleString("en-GB",{
    weekday:"short", day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit"
  });
}
function henthornBand(level){
  if(level === null || isNaN(level)) return "Unknown";
  if(level < 0.30) return "Low";
  if(level < 0.38) return "Low fishable";
  if(level <= 0.45) return "Prime range";
  if(level <= 0.70) return "Good range";
  if(level <= 1.10) return "High";
  return "Very high";
}
function trendFromMovement(movement){
  if(movement === null || isNaN(movement)) return "Unknown";
  if(movement > 0.02) return "Rising";
  if(movement < -0.02) return "Falling";
  return "Steady";
}
async function getRiver(){
  const latest = await getJSON(EA_LATEST);
  const recent = await getJSON(EA_RECENT);

  const latestItem = latest.items && latest.items.length ? latest.items[0] : null;
  if(!latestItem) throw new Error("No latest EA reading returned");

  const level = Number(latestItem.value);
  const time = latestItem.dateTime;
  let movement = null;

  if(recent.items && recent.items.length > 1){
    const newest = Number(recent.items[recent.items.length - 1].value);
    const oldest = Number(recent.items[0].value);
    movement = newest - oldest;
  }

  return {
    level,
    time,
    movement,
    trend: trendFromMovement(movement),
    band: henthornBand(level)
  };
}
function renderLive(r){
  return `
    <section class="card">
      <div class="card-title">Live Henthorn Conditions</div>
      <div class="source">Environment Agency station 710305 · Ribble at Henthorn</div>
      <div class="level-wrap">
        <div class="level">${formatLevel(r.level)}</div>
        <div class="unit">m</div>
      </div>
      <div class="chips">
        <span class="chip chip-green">${r.band}</span>
        <span class="chip chip-blue">${r.trend}</span>
        <span class="chip chip-gold">${ageText(r.time)}</span>
      </div>
      <div class="stats">
        <div class="stat">
          <div class="stat-label">Recent movement</div>
          <div class="stat-value">${formatMovement(r.movement)}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Updated</div>
          <div class="stat-value">${fullTime(r.time)}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Water temperature</div>
          <div class="stat-value">Not available</div>
        </div>
        <div class="stat">
          <div class="stat-label">Rainfall</div>
          <div class="stat-value">Not verified</div>
        </div>
      </div>
      <div class="notice">
        Water temperature and rainfall are deliberately not guessed. They will only be shown when a trusted live source is connected.
      </div>
    </section>
  `;
}
function renderIntel(){
  return `
    <section class="card">
      <div class="card-title">Ribble Salmon Facts</div>
      <div class="source">Verified catch returns and river-wide salmon intelligence.</div>

      <div class="fact">
        <div class="fact-top">
          <div class="fact-tag">RFCA · 2023</div>
        </div>
        <div class="fact-title">Official salmon returns: 146 total, 0 killed</div>
        <div class="fact-text">
          RFCA reported 146 salmon caught across the Ribble system in 2023, with 100% catch and release.
        </div>
        <div class="number-row">
          <div class="mini"><div class="mini-label">Ribble</div><div class="mini-value">131</div></div>
          <div class="mini"><div class="mini-label">Hodder</div><div class="mini-value">13</div></div>
          <div class="mini"><div class="mini-label">Calder</div><div class="mini-value">2</div></div>
        </div>
      </div>

      <div class="fact">
        <div class="fact-top">
          <div class="fact-tag">RFCA · 2023</div>
        </div>
        <div class="fact-title">Official sea-trout returns: 418 total</div>
        <div class="fact-text">
          RFCA reported 418 sea trout across the system in 2023, with 94.6% catch and release.
        </div>
        <div class="number-row">
          <div class="mini"><div class="mini-label">Ribble</div><div class="mini-value">206</div></div>
          <div class="mini"><div class="mini-label">Hodder</div><div class="mini-value">192</div></div>
          <div class="mini"><div class="mini-label">Calder</div><div class="mini-value">20</div></div>
        </div>
      </div>

      <div class="fact">
        <div class="fact-top">
          <div class="fact-tag">RFCA · Waddow counter</div>
        </div>
        <div class="fact-title">Counter/catch mismatch</div>
        <div class="fact-text">
          RFCA noted that 989 salmon were recorded on the Waddow counter in 2023, while anglers reported 146 salmon caught. RFCA raised lack of effort and interpretation of counter data as possible context.
        </div>
      </div>

      <div class="fact">
        <div class="fact-top">
          <div class="fact-tag">BCAA · Skirbeck returns</div>
        </div>
        <div class="fact-title">Skirbeck salmon size returns</div>
        <div class="fact-text">
          BCAA’s River Ribble catch-return page shows 22 salmon at Skirbeck: 0 under 10 lb, 4 from 10–25 lb, and 18 over 25 lb.
        </div>
      </div>

      <div class="fact">
        <div class="fact-top">
          <div class="fact-tag">Run timing</div>
        </div>
        <div class="fact-title">Main run visibility: mid-October to December</div>
        <div class="fact-text">
          Ribble Rivers Trust identifies mid-October through December as the best time to witness the salmon run, especially after rain following a dry spell.
        </div>
      </div>
    </section>
  `;
}
async function init(){
  const content = document.getElementById("content");
  try{
    const river = await getRiver();
    content.innerHTML = renderLive(river) + renderIntel();
  }catch(e){
    content.innerHTML = `
      <section class="card">
        <div class="card-title">Live Henthorn Conditions</div>
        <div class="source">Environment Agency station 710305</div>
        <div class="notice">Live data unavailable: ${e.message}</div>
      </section>
      ${renderIntel()}
    `;
  }
}
setInterval(init,300000);
init();
</script>
</body>
</html>
