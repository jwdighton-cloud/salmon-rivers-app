<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ribble Henthorn Intelligence</title>

<style>
body {font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f5f6f7;color:#111;}
h1 {text-align:center;margin:20px 0 8px 0;font-size:26px;}
.build {text-align:center;font-size:14px;color:#666;margin-bottom:12px;}
.container {max-width:620px;margin:auto;padding:10px;}
.card {background:#fff;border-radius:22px;padding:16px;margin-bottom:18px;box-shadow:0 4px 10px rgba(0,0,0,0.06);}
.section {background:#f0f0f0;border-radius:16px;padding:12px;margin-top:12px;}
.section h3 {margin:0 0 8px;}
.big-level {font-size:42px;font-weight:800;margin:8px 0;}
.pill {display:inline-block;padding:7px 12px;border-radius:20px;background:#ddd;margin:4px 4px 4px 0;}
.good {background:#c8e6c9;}
.ok {background:#fff3cd;}
.bad {background:#ffcdd2;}
.small {font-size:13px;color:#555;line-height:1.5;}
.advice {font-size:16px;line-height:1.45;margin-top:8px;}
a {text-decoration:none;color:#1a0dab;font-weight:600;}
</style>
</head>

<body>

<h1>Ribble @ Henthorn</h1>
<div class="build">Build: 10040 — Henthorn-only decision screen</div>

<div class="container" id="content"></div>

<script>
const BUILD = "10040";
const HENTHORN_URL = "https://environment.data.gov.uk/flood-monitoring/id/stations/710305/readings?_sorted&_limit=12";

async function getHenthornData() {
  try {
    const res = await fetch(HENTHORN_URL, { cache: "no-store" });
    const data = await res.json();

    if (!data.items || data.items.length === 0) {
      return { level:null, time:null, trend:"Unavailable", change:null };
    }

    const readings = data.items
      .map(r => ({ value:Number(r.value), time:r.dateTime }))
      .filter(r => !isNaN(r.value))
      .sort((a,b) => new Date(b.time) - new Date(a.time));

    const latest = readings[0];
    const oldest = readings[readings.length - 1];
    const diff = latest.value - oldest.value;

    let trend = "Steady";
    if (diff > 0.10) trend = "Rising fast";
    else if (diff > 0.03) trend = "Rising";
    else if (diff < -0.10) trend = "Falling fast";
    else if (diff < -0.03) trend = "Falling";

    return {
      level: latest.value,
      time: latest.time,
      trend: trend,
      change: diff
    };

  } catch (e) {
    return { level:null, time:null, trend:"Unavailable", change:null };
  }
}

function getDecision(level, trend) {
  if (level === null) {
    return {
      label:"Unknown",
      cls:"ok",
      verdict:"Live Henthorn level unavailable.",
      advice:"Refresh the app or use the Environment Agency site directly."
    };
  }

  if (level < 0.30) {
    return {
      label:"Poor",
      cls:"bad",
      verdict:"Too low at Henthorn.",
      advice:"Likely skinny and difficult. Wait for fresh water unless you have a very specific reason to fish."
    };
  }

  if (level < 0.70) {
    if (trend === "Rising fast") {
      return {
        label:"Watch",
        cls:"ok",
        verdict:"Good height, but rising quickly.",
        advice:"Could improve, but watch colour and debris. Best checked again shortly before travelling."
      };
    }

    return {
      label:"Good",
      cls:"good",
      verdict:"Good Henthorn window.",
      advice:"Height is in the useful range and the trend is not a major warning."
    };
  }

  if (level < 1.20) {
    if (trend === "Falling" || trend === "Falling fast") {
      return {
        label:"Improving",
        cls:"good",
        verdict:"High but dropping.",
        advice:"Often a good window as the river settles. Focus on safer, slower lies."
      };
    }

    return {
      label:"High",
      cls:"ok",
      verdict:"Fishable but pushing.",
      advice:"Proceed carefully. River is carrying water; safer access and fishable lies matter."
    };
  }

  return {
    label:"Poor",
    cls:"bad",
    verdict:"Too high at Henthorn.",
    advice:"Not a normal fishing window. Wait for it to fall and settle."
  };
}

function formatTime(dt) {
  if (!dt) return "No timestamp";
  return new Date(dt).toLocaleString("en-GB");
}

function formatChange(change) {
  if (change === null || isNaN(change)) return "Movement unavailable";
  const sign = change > 0 ? "+" : "";
  return sign + change.toFixed(2) + " m across recent readings";
}

async function render() {
  const content = document.getElementById("content");

  content.innerHTML = `
    <div class="card">
      <h2>Loading live Henthorn data...</h2>
      <div class="section">
        <span class="pill ok">Please wait</span>
      </div>
    </div>
  `;

  const data = await getHenthornData();
  const decision = getDecision(data.level, data.trend);

  content.innerHTML = `
    <div class="card">
      <h2>Today’s Henthorn Reading</h2>

      <div class="big-level">
        ${data.level !== null ? data.level.toFixed(2) + " m" : "Unavailable"}
      </div>

      <span class="pill ${decision.cls}">${decision.label}</span>
      <span class="pill ok">${data.trend}</span>

      <div class="section">
        <h3>🎯 Decision</h3>
        <div class="advice"><strong>${decision.verdict}</strong><br>${decision.advice}</div>
      </div>

      <div class="section">
        <h3>📈 Movement</h3>
        <div class="small">
          ${formatChange(data.change)}<br>
          Updated: ${formatTime(data.time)}<br>
          Gauge: Environment Agency station 710305 — Ribble @ Henthorn
        </div>
      </div>

      <div class="section">
        <h3>🌡 Temperature</h3>
        <div class="small">
          Water temperature is not yet pulled directly into the app.
        </div>
        <a href="https://www.ribblefisheriesca.co.uk/live-water-quality-monitoring/" target="_blank">
          Open RFCA live water-quality dashboard
        </a>
      </div>

      <div class="section">
        <h3>🔗 Useful Links</h3>
        <a href="https://check-for-flooding.service.gov.uk/station/5066" target="_blank">
          GOV.UK Henthorn gauge
        </a><br>
        <a href="https://ribblefishing.co.uk/" target="_blank">
          RFCA fishing information
        </a>
      </div>
    </div>
  `;
}

render();
</script>

</body>
</html>
