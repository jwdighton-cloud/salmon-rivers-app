<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salmon Rivers Intelligence</title>

<style>
body {font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f5f6f7;color:#111;}
h1 {text-align:center;margin:20px 0 10px 0;font-size:26px;}
.build {text-align:center;font-size:14px;color:#666;margin-bottom:10px;}
.tabs {display:flex;justify-content:center;gap:10px;margin-bottom:20px;}
.tab {padding:10px 16px;border-radius:20px;background:#e5e5e5;cursor:pointer;}
.tab.active {background:#cfe8cf;border:2px solid #4caf50;}
.container {max-width:600px;margin:auto;padding:10px;}
.card {background:#fff;border-radius:20px;padding:16px;margin-bottom:20px;box-shadow:0 4px 10px rgba(0,0,0,0.05);}
.section {background:#f0f0f0;border-radius:16px;padding:12px;margin-top:12px;}
.section h3 {margin:0 0 8px;}
.big {font-size:34px;font-weight:700;margin:6px 0;}
.pill {display:inline-block;padding:6px 12px;border-radius:20px;background:#ddd;margin:4px;}
.good {background:#c8e6c9;}
.ok {background:#fff3cd;}
.bad {background:#ffcdd2;}
.small {font-size:13px;color:#555;line-height:1.5;}
.advice {font-size:15px;line-height:1.45;margin-top:8px;}
a {text-decoration:none;color:#1a0dab;font-weight:500;}
</style>
</head>

<body>

<h1>Salmon Rivers Intelligence</h1>
<div class="build">Build: 10039 — Henthorn focused</div>

<div class="tabs">
  <div class="tab active">🇬🇧 UK</div>
</div>

<div class="container" id="content"></div>

<script>
const HENTHORN_URL = "https://environment.data.gov.uk/flood-monitoring/id/stations/710305/readings?_sorted&_limit=12";

async function getHenthornData() {
  try {
    const res = await fetch(HENTHORN_URL, { cache: "no-store" });
    const data = await res.json();

    if (!data.items || data.items.length === 0) {
      return { level:null, time:null, trend:"Unavailable", change:null };
    }

    const readings = data.items
      .map(r => ({ value:Number(r.value), time:r.dateTime }))
      .filter(r => !isNaN(r.value))
      .sort((a,b) => new Date(b.time) - new Date(a.time));

    const latest = readings[0];
    const oldest = readings[readings.length - 1];
    const diff = latest.value - oldest.value;

    let trend = "Steady";
    if (diff > 0.10) trend = "Rising fast";
    else if (diff > 0.03) trend = "Rising";
    else if (diff < -0.10) trend = "Falling fast";
    else if (diff < -0.03) trend = "Falling";

    return {
      level: latest.value,
      time: latest.time,
      trend: trend,
      change: diff
    };

  } catch (e) {
    return { level:null, time:null, trend:"Unavailable", change:null };
  }
}

function getDecision(level, trend) {
  if (level === null) return {text:"Unknown",class:"ok",advice:"Data unavailable"};

  if (level < 0.30) return {text:"Poor",class:"bad",advice:"Too low"};
  if (level < 0.70 && trend !== "Rising") return {text:"Good",class:"good",advice:"Strong window"};
  if (level < 0.90) return {text:"Watch",class:"ok",advice:"Check trend"};
  if (level < 1.20) return {text:"High",class:"ok",advice:"Fishable but pushing"};
  return {text:"Poor",class:"bad",advice:"Too high"};
}

function formatTime(dt) {
  if (!dt) return "No timestamp";
  return new Date(dt).toLocaleString("en-GB");
}

function formatChange(change) {
  if (change === null) return "";
  const sign = change > 0 ? "+" : "";
  return sign + change.toFixed(2) + " m";
}

async function render() {
  const content = document.getElementById('content');

  content.innerHTML = `
    <div class="card">
      <h2>River Ribble @ Henthorn</h2>
      <div class="section"><h3>Loading...</h3></div>
    </div>
  `;

  const data = await getHenthornData();
  const decision = getDecision(data.level, data.trend);

  content.innerHTML = `
    <div class="card">
      <h2>River Ribble @ Henthorn</h2>

      <div class="section">
        <h3>🌊 Level</h3>
        <div class="big">
          ${data.level !== null ? data.level.toFixed(2)+" m" : "Unavailable"}
        </div>
        <span class="pill ${decision.class}">${decision.text}</span>
        <span class="pill ok">${data.trend}</span>
      </div>

      <div class="section">
        <h3>🎯 Advice</h3>
        <div class="advice">${decision.advice}</div>
      </div>

      <div class="section">
        <h3>📈 Movement</h3>
        <div class="small">
          ${formatChange(data.change)}<br>
          Updated: ${formatTime(data.time)}
        </div>
      </div>

      <div class="section">
        <h3>🌡 Temperature</h3>
        <a href="https://www.ribblefisheriesca.co.uk/live-water-quality-monitoring/" target="_blank">
          RFCA Live Water Data
        </a>
      </div>

    </div>
  `;
}

render();
</script>

</body>
</html>
