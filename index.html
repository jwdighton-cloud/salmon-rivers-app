<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Salmon Rivers</title>
<link rel="manifest" href="manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; font-family:Arial; background:#f0f2f5; }

header {
  background:#0f5132;
  color:white;
  padding:15px;
  text-align:center;
}

.container { padding:15px; }

.card {
  background:white;
  padding:15px;
  margin-bottom:12px;
  border-radius:10px;
}

.note { font-size:14px; color:#555; margin-top:6px; }

.trend {
  font-size:16px;
  margin-top:6px;
  font-weight:bold;
}
</style>

</head>

<body>

<header>🎣 Salmon Rivers</header>

<div class="container" id="list"></div>

<script>

const rivers = [
  "River Ribble",
  "River Tyne",
  "River Eden"
];

let sharedData = {};

// 🔥 Trend logic
function getTrend(history) {
  if (!history || history.length < 2) return "➖ Steady";

  const last = history[history.length - 1].score;
  const prev = history[history.length - 2].score;

  if (last > prev) return "⬆ Rising";
  if (last < prev) return "⬇ Falling";
  return "➖ Steady";
}

// Convert text to simple score
function scoreText(text) {
  text = text.toLowerCase();

  if (text.includes("good") || text.includes("fish")) return 2;
  if (text.includes("ok")) return 1;
  return 0;
}

// Add report
function addReport(river) {
  let user = localStorage.getItem("username");

  if (!user) {
    user = prompt("Your name:");
    localStorage.setItem("username", user);
  }

  const text = prompt("Enter report:");
  if (!text) return;

  const entry = {
    text,
    user,
    time: new Date().toISOString(),
    score: scoreText(text)
  };

  const history = sharedData[river]?.history || [];
  history.push(entry);

  db.collection("reports").doc(river).set({
    history
  });
}

// Render
function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  rivers.forEach(river => {

    const data = sharedData[river] || {};
    const history = data.history || [];
    const latest = history[history.length - 1];

    const trend = getTrend(history);

    list.innerHTML += `
      <div class="card">
        <b>${river}</b>

        <div class="trend">${trend}</div>

        <div class="note">
          ${latest ? latest.text : "No report yet"}
        </div>

        ${latest ? `<div class="note">— ${latest.user}</div>` : ""}

        <button onclick="addReport('${river}')">Add Report</button>
      </div>
    `;
  });
}

</script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCdvFvxZVAg-3YXb3XQqkCVDy2bfLbtCfs",
  authDomain: "salmon-rivers-app.firebaseapp.com",
  projectId: "salmon-rivers-app",
  storageBucket: "salmon-rivers-app.firebasestorage.app",
  messagingSenderId: "8166382021",
  appId: "1:8166382021:web:e1164ea8ab1653ff1c93ac"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 🔄 LIVE SYNC
db.collection("reports").onSnapshot(snapshot => {
  sharedData = {};
  snapshot.forEach(doc => {
    sharedData[doc.id] = doc.data();
  });
  render();
});
</script>

</body>
</html>
