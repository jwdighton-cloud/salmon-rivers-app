<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ribble Henthorn Intelligence</title>

<style>
body {font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f5f6f7;color:#111;}
h1 {text-align:center;margin:20px 0 8px 0;font-size:26px;}
.build {text-align:center;font-size:14px;color:#666;margin-bottom:12px;}
.container {max-width:620px;margin:auto;padding:10px;}
.card {background:#fff;border-radius:22px;padding:16px;margin-bottom:18px;box-shadow:0 4px 10px rgba(0,0,0,0.06);}
.section {background:#f0f0f0;border-radius:16px;padding:12px;margin-top:12px;}
.section h3 {margin:0 0 8px;}
.big-level {font-size:42px;font-weight:800;margin:8px 0;}
.pill {display:inline-block;padding:7px 12px;border-radius:20px;background:#ddd;margin:4px;}
.good {background:#c8e6c9;}
.ok {background:#fff3cd;}
.bad {background:#ffcdd2;}
.alert {background:#d7ecff;}
.warn {background:#ffe0b2;}
.small {font-size:13px;color:#555;line-height:1.5;}
.advice {font-size:16px;line-height:1.45;margin-top:8px;}
button {font-size:16px;padding:10px 14px;border:0;border-radius:12px;background:#111;color:#fff;margin:4px;}
input {font-size:18px;padding:10px;border-radius:12px;border:1px solid #ccc;width:120px;}
a {text-decoration:none;color:#1a0dab;font-weight:600;}
</style>
</head>

<body>

<h1>Ribble @ Henthorn</h1>
<div class="build">Build: 10044 — freshness + refresh</div>

<div class="container" id="content"></div>

<script>
const HENTHORN_URL = "https://environment.data.gov.uk/flood-monitoring/id/stations/710305/readings?_sorted&_limit=12";
const TEMP_KEY = "henthorn_water_temp_c";
const LAST_STATE_KEY = "henthorn_last_condition";
const ALERT_KEY = "henthorn_alert_enabled";

async function getHenthornData() {
  try {
    const res = await fetch(HENTHORN_URL, { cache: "no-store" });
    const data = await res.json();

    if (!data.items || data.items.length === 0) {
      return { level:null, time:null, trend:"Unavailable", change:null };
    }

    const readings = data.items
      .map(r => ({ value:Number(r.value), time:r.dateTime }))
      .filter(r => !isNaN(r.value))
      .sort((a,b) => new Date(b.time) - new Date(a.time));

    const latest = readings[0];
    const oldest = readings[readings.length - 1];
    const diff = latest.value - oldest.value;

    let trend = "Steady";
    if (diff > 0.12) trend = "Rising fast";
    else if (diff > 0.04) trend = "Rising";
    else if (diff < -0.12) trend = "Falling fast";
    else if (diff < -0.04) trend = "Falling";

    return { level:latest.value, time:latest.time, trend:trend, change:diff };

  } catch (e) {
    return { level:null, time:null, trend:"Unavailable", change:null };
  }
}

function getReadingAgeMinutes(dt) {
  if (!dt) return null;
  const now = new Date();
  const reading = new Date(dt);
  return Math.round((now - reading) / 60000);
}

function getFreshnessStatus(minutes) {
  if (minutes === null) return {text:"No timestamp", cls:"ok"};

  if (minutes <= 15) return {text:"Live ("+minutes+" min ago)", cls:"good"};
  if (minutes <= 60) return {text:minutes+" min old", cls:"ok"};
  return {text:"Stale ("+minutes+" min old)", cls:"warn"};
}

function getSavedTemp() {
  const raw = localStorage.getItem(TEMP_KEY);
  const temp = Number(raw);
  return isNaN(temp) ? null : temp;
}

function saveTemp() {
  const input = document.getElementById("tempInput");
  const value = Number(input.value);
  if (!isNaN(value)) {
    localStorage.setItem(TEMP_KEY, value);
    render();
  }
}

function clearTemp() {
  localStorage.removeItem(TEMP_KEY);
  render();
}

function alertsEnabled() {
  return localStorage.getItem(ALERT_KEY) === "yes";
}

function toggleAlerts() {
  localStorage.setItem(ALERT_KEY, alertsEnabled() ? "no" : "yes");
  render();
}

function getDecision(level, trend, temp) {
  if (level === null) return {label:"Unknown",cls:"ok",verdict:"No data",advice:"Refresh"};

  if (temp !== null && temp > 18) return {label:"Poor",cls:"bad",verdict:"Too warm",advice:"Fish welfare risk"};

  if (level < 0.30) return {label:"Poor",cls:"bad",verdict:"Too low",advice:"Wait"};

  if (level < 0.70) return {label:"Good",cls:"good",verdict:"Strong window",advice:"Fish"};

  if (level < 1.20) return {label:"High",cls:"ok",verdict:"Fishable",advice:"Care needed"};

  return {label:"Poor",cls:"bad",verdict:"Too high",advice:"Wait"};
}

function formatTime(dt) {
  if (!dt) return "No timestamp";
  return new Date(dt).toLocaleString("en-GB");
}

async function render() {
  const content = document.getElementById("content");

  const data = await getHenthornData();
  const temp = getSavedTemp();
  const decision = getDecision(data.level, data.trend, temp);

  const ageMin = getReadingAgeMinutes(data.time);
  const freshness = getFreshnessStatus(ageMin);

  content.innerHTML = `
    <div class="card">

      <button onclick="render()">🔄 Refresh now</button>

      <div class="big-level">
        ${data.level ? data.level.toFixed(2)+" m" : "Unavailable"}
      </div>

      <span class="pill ${decision.cls}">${decision.label}</span>
      <span class="pill ok">${data.trend}</span>
      <span class="pill ${freshness.cls}">${freshness.text}</span>

      <div class="section">
        <h3>🎯 Decision</h3>
        <div class="advice">
          <strong>${decision.verdict}</strong><br>${decision.advice}
        </div>
      </div>

      <div class="section">
        <h3>📈 Data</h3>
        <div class="small">
          Updated: ${formatTime(data.time)}<br>
          Movement: ${data.change !== null ? data.change.toFixed(2)+" m" : "n/a"}
        </div>
      </div>

      <div class="section">
        <h3>🌡 Temperature</h3>
        <input id="tempInput" type="number" placeholder="°C" value="${temp ?? ""}">
        <button onclick="saveTemp()">Save</button>
        <button onclick="clearTemp()">Clear</button>
      </div>

      <div class="section">
        <h3>🔗</h3>
        <a href="https://check-for-flooding.service.gov.uk/station/5066" target="_blank">
          Open GOV.UK gauge
        </a>
      </div>

    </div>
  `;
}

render();
</script>

</body>
</html>
