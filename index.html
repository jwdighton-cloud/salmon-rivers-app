<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salmon Rivers Intelligence</title>

<style>
body { font-family: Arial; background:#eef2f5; margin:0; padding:16px; }
h1 { text-align:center; margin-bottom:6px; }

.tabs { display:flex; gap:8px; margin-bottom:16px; }
.tab {
  flex:1; padding:10px; border-radius:999px;
  border:none; background:white; font-weight:bold;
}
.tab.active { background:#dff8df; border:2px solid #6ac96a; }

.river-card {
  background:white; padding:16px; border-radius:16px;
  margin-bottom:16px; box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.section {
  background:#f7f9fb; padding:12px;
  border-radius:12px; margin-top:12px;
}

.section h3 { margin:0 0 6px 0; }

.links a {
  display:inline-block;
  margin:6px 6px 0 0;
  padding:6px 10px;
  border-radius:10px;
  background:#eef2f5;
  text-decoration:none;
  font-weight:bold;
  font-size:13px;
}

.operator a { background:#e6f9e6; }
.magazine a { background:#fff7d9; }

textarea {
  width:100%;
  margin-top:10px;
  padding:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<h1>Salmon Rivers Intelligence</h1>

<div class="tabs">
  <button class="tab active" onclick="setCountry('UK', this)">🇬🇧 UK</button>
  <button class="tab" onclick="setCountry('Norway', this)">🇳🇴 Norway</button>
  <button class="tab" onclick="setCountry('Iceland', this)">🇮🇸 Iceland</button>
</div>

<div id="app"></div>

<script>
let selectedCountry = "UK";

const rivers = [
{
id:"ribble", country:"UK", name:"River Ribble",
operator:[
["RFCA","https://ribbletrust.org.uk/"]
]
},
{
id:"tyne", country:"UK", name:"River Tyne",
operator:[]
},
{
id:"east_ranga", country:"Iceland", name:"East Rangá",
operator:[
["⭐ RIPP Sporting","https://www.rippsporting.com/eastranga"]
]
},
{
id:"gaula", country:"Norway", name:"Gaula",
operator:[]
}
];

function setCountry(c, btn){
  selectedCountry=c;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  btn.classList.add("active");
  render();
}

function magazineLinks(name){
  const q = encodeURIComponent(name + " salmon fishing");
  return `
    <a href="https://www.google.com/search?q=site:troutandsalmon.com+${q}" target="_blank">Trout & Salmon</a>
    <a href="https://www.google.com/search?q=${q}+fishing+report" target="_blank">General reports</a>
  `;
}

function render(){
  const list = rivers.filter(r=>r.country===selectedCountry);

  document.getElementById("app").innerHTML = list.map(r=>{

    const notes = localStorage.getItem(r.id+"-notes") || "";

    return `
      <div class="river-card">

        <h2>${r.name}</h2>

        <div class="section operator">
          <h3>🎣 Operator Intel</h3>
          <div class="links">
            ${r.operator.map(o=>`<a href="${o[1]}" target="_blank">${o[0]}</a>`).join("") || "None added yet"}
          </div>
        </div>

        <div class="section magazine">
          <h3>📰 Magazine Intel</h3>
          <div class="links">
            ${magazineLinks(r.name)}
          </div>
        </div>

        <div class="section">
          <h3>🌤 General Links</h3>
          <div class="links">
            <a href="https://www.bbc.co.uk/weather" target="_blank">Weather</a>
          </div>
        </div>

        <textarea placeholder="Your notes..."
          oninput="localStorage.setItem('${r.id}-notes',this.value)">
${notes}
        </textarea>

      </div>
    `;

  }).join("");
}

render();
</script>

</body>
</html>
