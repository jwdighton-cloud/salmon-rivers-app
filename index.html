<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salmon Rivers Intelligence</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  margin: 0;
  background: #f5f6f7;
  color: #111;
}

h1 {
  text-align: center;
  margin: 20px 0;
  font-size: 28px;
}

.tabs {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 20px;
}

.tab {
  padding: 10px 16px;
  border-radius: 20px;
  background: #e5e5e5;
  cursor: pointer;
}

.tab.active {
  background: #cfe8cf;
  border: 2px solid #4caf50;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 10px;
}

.card {
  background: #fff;
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 20px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

.section {
  background: #f0f0f0;
  border-radius: 16px;
  padding: 12px;
  margin-top: 12px;
}

.section h3 {
  margin: 0 0 8px;
}

.pill {
  display: inline-block;
  padding: 6px 12px;
  border-radius: 20px;
  background: #ddd;
  margin: 4px;
}

.good { background: #c8e6c9; }
.ok { background: #fff3cd; }
.bad { background: #ffcdd2; }

a {
  text-decoration: none;
  color: #1a0dab;
  font-weight: 500;
}
</style>
</head>

<body>

<h1>Salmon Rivers Intelligence</h1>

<div class="tabs">
  <div class="tab active" onclick="showCountry('uk', this)">🇬🇧 UK</div>
  <div class="tab" onclick="showCountry('norway', this)">🇳🇴 Norway</div>
  <div class="tab" onclick="showCountry('iceland', this)">🇮🇸 Iceland</div>
</div>

<div class="container" id="content"></div>

<script>

// 🔵 Get Ribble Level (improved)
async function getRibbleLevel() {
  try {
    const res = await fetch("https://environment.data.gov.uk/flood-monitoring/id/stations?riverName=Ribble");
    const data = await res.json();

    if (data.items && data.items.length > 0 && data.items[0].latestReading) {
      return data.items[0].latestReading.value;
    }
  } catch (e) {}

  return null;
}

// 🧠 Fishability logic
function getFishability(level) {
  if (!level) return {text: "Unknown", class: "ok"};

  if (level < 0.6) return {text: "Low", class: "bad"};
  if (level < 1.2) return {text: "Good", class: "good"};
  if (level < 2.0) return {text: "High", class: "ok"};
  return {text: "Very High", class: "bad"};
}

async function showCountry(country, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');

  const content = document.getElementById('content');

  if (country === 'uk') {

    const level = await getRibbleLevel();
    const fish = getFishability(level);

    content.innerHTML = `
      <div class="card">
        <h2>River Ribble</h2>

        <div class="section">
          <h3>🎯 Fishability</h3>
          <span class="pill ${fish.class}">${fish.text}</span>
        </div>

        <div class="section">
          <h3>🌊 River Level</h3>
          <span class="pill good">${level ? level + " m" : "Unavailable"}</span>
        </div>

        <div class="section">
          <h3>🌡 Temperature</h3>
          <span class="pill">Coming next</span>
        </div>

        <div class="section">
          <h3>🌦 Weather</h3>
          <a href="https://www.metoffice.gov.uk/" target="_blank">Met Office</a>
        </div>

        <div class="section">
          <h3>🎣 Operator Intel</h3>
          <span class="pill good"><a href="https://ribblefishing.co.uk/" target="_blank">RFCA</a></span>
        </div>

        <div class="section">
          <h3>📰 Magazine Intel</h3>
          <span class="pill ok"><a href="https://troutandsalmon.com/" target="_blank">Trout & Salmon</a></span>
        </div>
      </div>
    `;
  }

  if (country === 'norway') {
    content.innerHTML = `
      <div class="card">
        <h2>River Gaula</h2>
        <div class="section"><h3>Data</h3><span class="pill">Coming next</span></div>
      </div>
    `;
  }

  if (country === 'iceland') {
    content.innerHTML = `
      <div class="card">
        <h2>East Rangá</h2>
        <div class="section"><h3>Data</h3><span class="pill">Coming next</span></div>
      </div>
    `;
  }
}

// load default
showCountry('uk', document.querySelector('.tab'));

</script>

</body>
</html>
