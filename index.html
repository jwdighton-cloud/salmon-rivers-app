<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ribble @ Henthorn</title>

<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f4f6f7;color:#111;}
.app{max-width:640px;margin:auto;padding:14px;}
h1{text-align:center;font-size:24px;margin:16px 0;}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 4px 10px rgba(0,0,0,.05);}
.title{font-size:18px;font-weight:700;}
.sub{font-size:13px;color:#666;margin-bottom:10px;}
.level{font-size:46px;font-weight:800;}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.pill{padding:5px 10px;border-radius:999px;background:#e6e6e6;font-size:12px;font-weight:600;}
.info{background:#dbeafe;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
.stat{background:#f1f3f4;border-radius:12px;padding:10px;}
.stat-label{font-size:11px;color:#666;}
.stat-value{font-size:15px;font-weight:700;}
.links a{display:block;background:#eef2ff;border-radius:12px;padding:10px;margin-top:6px;text-decoration:none;color:#1a0dab;font-weight:600;}
.note{font-size:12px;color:#666;line-height:1.4;margin-top:10px;}
.badge{font-size:11px;color:#444;background:#eee;border-radius:999px;padding:3px 8px;margin-left:6px;}
</style>
</head>

<body>
<div class="app">
<h1>Ribble @ Henthorn</h1>
<div id="content"></div>
</div>

<script>
const EA_LATEST="https://environment.data.gov.uk/flood-monitoring/id/stations/710305/readings?latest";
const EA_RECENT="https://environment.data.gov.uk/flood-monitoring/id/stations/710305/readings?_sorted&_limit=12";

const WEATHER="https://api.open-meteo.com/v1/forecast?latitude=53.84&longitude=-2.43&current=temperature_2m,precipitation&hourly=precipitation&past_days=1&forecast_days=1&timezone=Europe%2FLondon";

async function getJSON(url){
  const r=await fetch(url,{cache:"no-store"});
  if(!r.ok)throw new Error("HTTP "+r.status);
  return await r.json();
}

function safe(v,suffix=""){
  if(v===null||v===undefined||isNaN(v))return "—";
  return Number(v).toFixed(1)+suffix;
}

function age(dt){
  if(!dt)return "—";
  const m=Math.round((Date.now()-new Date(dt))/60000);
  if(m<60)return m+" min";
  return Math.round(m/60)+" hr";
}

async function getRiver(){
  const latest=await getJSON(EA_LATEST);
  const recent=await getJSON(EA_RECENT);

  const level=Number(latest.items?.[0]?.value);
  const time=latest.items?.[0]?.dateTime;

  let movement=null;
  let trend="Steady";

  if(recent.items?.length>1){
    const newest=Number(recent.items[recent.items.length-1].value);
    const oldest=Number(recent.items[0].value);
    movement=newest-oldest;

    if(movement>0.02)trend="Rising";
    else if(movement<-0.02)trend="Falling";
  }

  return{level,time,movement,trend};
}

async function getWeather(){
  const d=await getJSON(WEATHER);

  const temp=d.current?.temperature_2m;
  const rainNow=d.current?.precipitation;

  let rain6h=null;

  if(d.hourly?.time&&d.hourly?.precipitation){
    const now=new Date();
    const sixHoursAgo=new Date(now.getTime()-6*60*60*1000);
    rain6h=0;

    for(let i=0;i<d.hourly.time.length;i++){
      const t=new Date(d.hourly.time[i]);
      if(t>=sixHoursAgo&&t<=now){
        rain6h+=Number(d.hourly.precipitation[i]||0);
      }
    }
  }

  return{temp,rainNow,rain6h};
}

function render(r,w){
  return`
  <div class="card">
    <div class="title">Live Conditions</div>
    <div class="sub">EA station 710305 · Henthorn</div>

    <div class="level">${safe(r.level," m")}</div>

    <div class="row">
      <span class="pill">${r.trend}</span>
      <span class="pill info">${age(r.time)}</span>
    </div>

    <div class="grid">
      <div class="stat">
        <div class="stat-label">Movement</div>
        <div class="stat-value">${safe(r.movement," m")}</div>
      </div>

      <div class="stat">
        <div class="stat-label">Air Temp Nearby</div>
        <div class="stat-value">${safe(w.temp,"°C")}</div>
      </div>

      <div class="stat">
        <div class="stat-label">Rain Now Nearby</div>
        <div class="stat-value">${safe(w.rainNow," mm")}</div>
      </div>

      <div class="stat">
        <div class="stat-label">Rain Last 6h Nearby</div>
        <div class="stat-value">${safe(w.rain6h," mm")}</div>
      </div>

      <div class="stat">
        <div class="stat-label">Water Temp</div>
        <div class="stat-value">—</div>
      </div>
    </div>

    <div class="note">
      River level is live EA data for Henthorn. Weather/rainfall is nearby modelled data, not a riverbank rain gauge. Water temperature is not guessed.
    </div>
  </div>

  <div class="card">
    <div class="title">Ribble Salmon Intel</div>
    <div class="sub">Whole-river catch reports, angler signals and source links</div>

    <div class="links">
      <a href="https://www.salmonfishingforum.com/threads/river-ribble-2026.292508/" target="_blank">Salmon Fishing Forum — River Ribble 2026 <span class="badge">current thread</span></a>
      <a href="https://www.salmonfishingforum.com/threads/river-ribble-2025.289774/" target="_blank">Salmon Fishing Forum — River Ribble 2025 <span class="badge">recent archive</span></a>
      <a href="https://www.seatroutforum.com/threads/ribble-2025.95925/" target="_blank">Sea Trout Forum — Ribble 2025 <span class="badge">angler reports</span></a>
      <a href="https://www.ribblefisheriesca.co.uk/ribble-2023-catch-returns/" target="_blank">RFCA — Ribble Catch Returns <span class="badge">official returns</span></a>
      <a href="https://www.facebook.com/groups/511047772383310/" target="_blank">Facebook — River Ribble Catch Reports <span class="badge">login may be needed</span></a>
      <a href="https://www.facebook.com/groups/297569024750769/" target="_blank">Facebook — Ribble Salmon & Sea Trout <span class="badge">login may be needed</span></a>
      <a href="https://www.google.com/search?q=site%3Atroutandsalmon.com+Ribble+salmon" target="_blank">Trout & Salmon — Ribble Search <span class="badge">targeted search</span></a>
      <a href="https://www.google.com/search?q=%22River+Ribble%22+salmon+catch+report" target="_blank">Web Search — Ribble Salmon Catch Reports <span class="badge">broad search</span></a>
    </div>

    <div class="note">
      Static GitHub Pages cannot reliably scrape forums, Facebook or magazine pages live. This panel uses direct Ribble-specific sources now; automated catch harvesting needs a backend JSON feed later.
    </div>
  </div>
  `;
}

async function init(){
  try{
    const r=await getRiver();
    const w=await getWeather();
    document.getElementById("content").innerHTML=render(r,w);
  }catch(e){
    document.getElementById("content").innerHTML=
      `<div class="card"><div class="title">Data unavailable</div><div class="note">${e.message}</div></div>`;
  }
}

setInterval(init,300000);
init();
</script>
</body>
</html>
