<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ribble Henthorn Intelligence</title>

<style>
body {font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f5f6f7;color:#111;}
h1 {text-align:center;margin:20px 0 8px;font-size:26px;}
.build {text-align:center;font-size:14px;color:#666;margin-bottom:12px;}
.container {max-width:620px;margin:auto;padding:10px;}
.card {background:#fff;border-radius:22px;padding:16px;box-shadow:0 4px 10px rgba(0,0,0,0.06);}
.section {background:#f0f0f0;border-radius:16px;padding:12px;margin-top:12px;}
.big-level {font-size:42px;font-weight:800;}
.pill {display:inline-block;padding:7px 12px;border-radius:20px;margin:4px;}
.good {background:#c8e6c9;}
.ok {background:#fff3cd;}
.bad {background:#ffcdd2;}
.conf-high {background:#c8e6c9;}
.conf-med {background:#fff3cd;}
.conf-low {background:#ffcdd2;}
button {padding:10px;border-radius:12px;border:0;background:#111;color:#fff;margin:4px;}
.small {font-size:13px;color:#555;}
</style>
</head>

<body>

<h1>Ribble @ Henthorn</h1>
<div class="build">Build: 10045 — FINAL HENTHORN</div>

<div class="container" id="app"></div>

<script>
const URL = "https://environment.data.gov.uk/flood-monitoring/id/stations/710305/readings?_sorted&_limit=12";

async function getData(){
  const r = await fetch(URL,{cache:"no-store"});
  const d = await r.json();

  const readings = d.items.map(x=>({
    v:Number(x.value),
    t:new Date(x.dateTime)
  })).sort((a,b)=>b.t-a.t);

  return readings;
}

function smoothTrend(readings){
  if(readings.length < 4) return {trend:"Unknown",rate:0};

  let changes = [];
  for(let i=0;i<readings.length-1;i++){
    changes.push(readings[i].v - readings[i+1].v);
  }

  const avg = changes.reduce((a,b)=>a+b,0)/changes.length;

  if(avg > 0.02) return {trend:"Rising",rate:avg};
  if(avg < -0.02) return {trend:"Falling",rate:avg};

  return {trend:"Steady",rate:avg};
}

function getConfidence(readings, trend){
  if(!readings.length) return {label:"Low",cls:"conf-low"};

  const ageMin = (Date.now() - readings[0].t)/60000;

  let score = 0;

  if(ageMin < 20) score += 2;
  else if(ageMin < 60) score += 1;

  if(Math.abs(trend.rate) < 0.03) score += 2;
  else if(Math.abs(trend.rate) < 0.06) score += 1;

  if(score >= 4) return {label:"High confidence",cls:"conf-high"};
  if(score >= 2) return {label:"Medium confidence",cls:"conf-med"};

  return {label:"Low confidence",cls:"conf-low"};
}

function decision(level, trend, confidence){
  if(level < 0.30) return {label:"Poor",cls:"bad",text:"Too low"};

  if(level < 0.65){
    if(trend.trend === "Rising") return {label:"Watch",cls:"ok",text:"Good but rising"};

    return {label:"Good",cls:"good",text:"Strong window"};
  }

  if(level < 1.1){
    if(trend.trend === "Falling") return {label:"Improving",cls:"good",text:"Dropping into condition"};

    return {label:"High",cls:"ok",text:"Fishable but pushing"};
  }

  return {label:"Poor",cls:"bad",text:"Too high"};
}

function render(readings){
  const latest = readings[0];
  const level = latest.v;

  const trend = smoothTrend(readings);
  const conf = getConfidence(readings, trend);
  const dec = decision(level, trend, conf);

  document.getElementById("app").innerHTML = `
    <div class="card">

      <button onclick="init()">🔄 Refresh</button>

      <div class="big-level">${level.toFixed(2)} m</div>

      <div>
        <span class="pill ${dec.cls}">${dec.label}</span>
        <span class="pill ok">${trend.trend}</span>
        <span class="pill ${conf.cls}">${conf.label}</span>
      </div>

      <div class="section">
        <strong>${dec.text}</strong>
      </div>

      <div class="section small">
        Updated: ${latest.t.toLocaleString("en-GB")}
      </div>

    </div>
  `;
}

async function init(){
  const r = await getData();
  render(r);
}

init();
</script>

</body>
</html>
