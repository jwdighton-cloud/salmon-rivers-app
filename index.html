<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Salmon Rivers</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f5132">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f2f5;
    }

    header {
      background: #0f5132;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      padding: 15px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      background: #ddd;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .tab.active {
      background: #0f5132;
      color: white;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .river-name {
      font-size: 18px;
      font-weight: bold;
    }

    .status {
      margin-top: 5px;
      font-size: 14px;
      padding: 4px 8px;
      display: inline-block;
      border-radius: 6px;
    }

    .good { background: #d4edda; color: #155724; }
    .ok { background: #fff3cd; color: #856404; }
    .poor { background: #f8d7da; color: #721c24; }

    .note {
      margin-top: 8px;
      font-size: 14px;
      color: #555;
    }

    .fav {
      float: right;
      cursor: pointer;
      font-size: 18px;
    }
  </style>
</head>

<body>

<header>🎣 Salmon Rivers</header>

<div class="container">

  <input type="text" id="search" placeholder="Search rivers...">

  <div class="tabs">
    <div class="tab active" onclick="setRegion('UK', this)">UK</div>
    <div class="tab" onclick="setRegion('Norway', this)">Norway</div>
    <div class="tab" onclick="setRegion('Iceland', this)">Iceland</div>
  </div>

  <div id="list"></div>

</div>

<script>

const rivers = [
  { name: "River Spey", region: "UK", status: "good", note: "Clear water, good spring run" },
  { name: "River Dee", region: "UK", status: "ok", note: "Slightly low water" },
  { name: "River Tay", region: "UK", status: "good", note: "Strong catches reported" },

  { name: "River Alta", region: "Norway", status: "good", note: "Prime conditions" },
  { name: "River Gaula", region: "Norway", status: "ok", note: "Water rising" },
  { name: "River Orkla", region: "Norway", status: "poor", note: "Low activity" },

  { name: "River Laxa", region: "Iceland", status: "good", note: "Excellent clarity" },
  { name: "River Rangá", region: "Iceland", status: "ok", note: "Moderate runs" },
  { name: "River Ellidaar", region: "Iceland", status: "poor", note: "Slow fishing" }
];

let currentRegion = "UK";

function render() {
  const list = document.getElementById("list");
  const search = document.getElementById("search").value.toLowerCase();

  list.innerHTML = "";

  rivers
    .filter(r => r.region === currentRegion)
    .filter(r => r.name.toLowerCase().includes(search))
    .forEach(r => {

      const div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        <div class="river-name">
          ${r.name}
          <span class="fav">☆</span>
        </div>
        <div class="status ${r.status}">
          ${r.status.toUpperCase()}
        </div>
        <div class="note">${r.note}</div>
      `;

      list.appendChild(div);
    });
}

function setRegion(region, el) {
  currentRegion = region;

  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  el.classList.add("active");

  render();
}

document.getElementById("search").addEventListener("input", render);

render();

</script>

</body>
</html>
