<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salmon Rivers Intelligence</title>

<style>
:root{
  --deep:#0b2f3a;
  --river:#0f4c5c;
  --gold:#d9a441;
  --blue:#dcecf4;
  --cream:#fff8e7;
  --card:#ffffff;
  --text:#101820;
  --muted:#607077;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:linear-gradient(180deg,#e6f1f4 0%,#f5f7f8 100%);
  color:var(--text);
}
.app{max-width:680px;margin:auto;padding:16px;}
.header{
  background:linear-gradient(135deg,var(--deep),var(--river));
  color:white;
  border-radius:26px;
  padding:22px 18px;
  margin:8px 0 18px;
  box-shadow:0 10px 24px rgba(15,76,92,.22);
}
.brand{
  font-size:15px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:#d7edf2;
}
.header h1{margin:8px 0 4px;font-size:34px;line-height:1.05;}
.subtitle{color:#cde6ec;font-size:15px;}
.card{
  background:var(--card);
  border-radius:24px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 8px 22px rgba(0,0,0,.07);
}
.card-title{font-size:21px;font-weight:900;margin-bottom:4px;}
.source{color:var(--muted);font-size:13px;margin-bottom:14px;}
.level-wrap{display:flex;align-items:flex-end;gap:8px;margin:6px 0 10px;}
.level{font-size:72px;font-weight:900;letter-spacing:-.05em;line-height:.95;}
.unit{font-size:24px;font-weight:800;color:var(--muted);margin-bottom:7px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;}
.chip{border-radius:999px;padding:8px 12px;font-weight:800;font-size:14px;}
.chip-blue{background:var(--blue);}
.chip-gold{background:var(--cream);color:#7a5600;}
.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px;
}
.stat{
  background:#f2f6f7;
  border-radius:18px;
  padding:14px;
  min-height:82px;
}
.stat-label{color:var(--muted);font-size:13px;margin-bottom:6px;}
.stat-value{font-size:21px;font-weight:900;}
.notice{
  background:#fff8e7;
  border-left:5px solid var(--gold);
  border-radius:18px;
  padding:13px 14px;
  color:#4c3b12;
  font-size:14px;
  line-height:1.45;
  margin-top:14px;
}
.fact{
  background:#f2f6f7;
  border-radius:18px;
  padding:14px;
  margin-top:10px;
}
.fact-tag{
  display:inline-block;
  font-size:12px;
  background:#e4edf0;
  padding:4px 8px;
  border-radius:999px;
  color:#31515b;
  font-weight:900;
  margin-bottom:8px;
}
.fact-title{font-size:17px;font-weight:900;margin-bottom:6px;}
.fact-text{font-size:14px;color:#333;line-height:1.45;}
.fact-source{font-size:12px;color:var(--muted);font-weight:800;margin-top:8px;}
.footer{text-align:center;color:var(--muted);font-size:12px;padding:8px 0 20px;}
.loading{color:var(--muted);font-weight:700;}
@media(max-width:480px){
  .header h1{font-size:30px;}
  .level{font-size:64px;}
  .stats{grid-template-columns:1fr 1fr;}
}
</style>
</head>

<body>
<div class="app">

<section class="header">
  <div class="brand">Salmon Rivers Intelligence</div>
  <h1>Ribble at Henthorn</h1>
  <div class="subtitle">Atlantic salmon only · verified current-season intelligence</div>
</section>

<main id="content">
  <section class="card">
    <div class="card-title">Live Henthorn Conditions</div>
    <div class="source">Loading Environment Agency station 710305...</div>
    <div class="loading">Fetching latest reading</div>
  </section>
</main>

<div class="footer">Gold Build 10050</div>
</div>

<script>
const EA_LATEST =
  "https://environment.data.gov.uk/flood-monitoring/id/stations/710305/readings?latest";

const EA_RECENT =
  "https://environment.data.gov.uk/flood-monitoring/id/stations/710305/readings?_sorted&_limit=12";

async function getJSON(url){
  const r = await fetch(url,{cache:"no-store"});
  if(!r.ok) throw new Error("HTTP " + r.status);
  return await r.json();
}

function formatLevel(v){
  if(v === null || v === undefined || isNaN(v)) return "—";
  return Number(v).toFixed(2);
}

function formatMovement(v){
  if(v === null || v === undefined || isNaN(v)) return "—";
  const sign = v > 0 ? "+" : "";
  return sign + Number(v).toFixed(2) + " m";
}

function ageText(dt){
  if(!dt) return "—";
  const mins = Math.round((Date.now() - new Date(dt)) / 60000);
  if(mins < 1) return "just now";
  if(mins < 60) return mins + " min old";
  return Math.round(mins / 60) + " hr old";
}

function fullTime(dt){
  if(!dt) return "—";
  return new Date(dt).toLocaleString("en-GB",{
    weekday:"short",
    day:"2-digit",
    month:"short",
    hour:"2-digit",
    minute:"2-digit"
  });
}

function trendFromMovement(movement){
  if(movement === null || isNaN(movement)) return "Unknown";
  if(movement > 0.02) return "Rising";
  if(movement < -0.02) return "Falling";
  return "Steady";
}

async function getRiver(){
  const latest = await getJSON(EA_LATEST);
  const recent = await getJSON(EA_RECENT);

  const latestItem = latest.items && latest.items.length ? latest.items[0] : null;
  if(!latestItem) throw new Error("No latest EA reading returned");

  const level = Number(latestItem.value);
  const time = latestItem.dateTime;

  let movement = null;

  if(recent.items && recent.items.length > 1){
    const newest = Number(recent.items[recent.items.length - 1].value);
    const oldest = Number(recent.items[0].value);
    movement = newest - oldest;
  }

  return {
    level,
    time,
    movement,
    trend: trendFromMovement(movement)
  };
}

function renderLive(r){
  return `
    <section class="card">
      <div class="card-title">Live Henthorn Conditions</div>
      <div class="source">Environment Agency station 710305 · Ribble at Henthorn</div>

      <div class="level-wrap">
        <div class="level">${formatLevel(r.level)}</div>
        <div class="unit">m</div>
      </div>

      <div class="chips">
        <span class="chip chip-blue">${r.trend}</span>
        <span class="chip chip-gold">${ageText(r.time)}</span>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="stat-label">Recent movement</div>
          <div class="stat-value">${formatMovement(r.movement)}</div>
        </div>

        <div class="stat">
          <div class="stat-label">Updated</div>
          <div class="stat-value">${fullTime(r.time)}</div>
        </div>

        <div class="stat">
          <div class="stat-label">Water temperature</div>
          <div class="stat-value">Not available</div>
        </div>

        <div class="stat">
          <div class="stat-label">Rainfall</div>
          <div class="stat-value">Not verified</div>
        </div>
      </div>

      <div class="notice">
        This panel shows measured or verified data only. No inferred fishability ratings, no guessed water temperature, and no unverified rainfall.
      </div>
    </section>
  `;
}

function renderIntel(){
  return `
    <section class="card">
      <div class="card-title">Atlantic Salmon Intelligence</div>
      <div class="source">Current-season Ribble salmon facts only. No sea-trout, trout, or mixed-species figures.</div>

      <div class="fact">
        <div class="fact-tag">Latest verified salmon signal</div>
        <div class="fact-title">13 Apr 2026 — salmon catches reported across the catchment</div>
        <div class="fact-text">
          Publicly visible River Ribble catch-report wording states that fish were continuing to be caught across the catchment during the week commencing 13 April 2026. This is the latest current-season catch signal currently held in the app.
        </div>
        <div class="fact-source">Source: River Ribble Catch Reports · verified public snippet</div>
      </div>

      <div class="fact">
        <div class="fact-tag">Current salmon total</div>
        <div class="fact-title">No verified 2026 whole-river salmon total found</div>
        <div class="fact-text">
          No reliable public 2026 River Ribble Atlantic salmon total has been verified. The app therefore does not display a current numerical total.
        </div>
        <div class="fact-source">Status: not published / not verified</div>
      </div>

      <div class="fact">
        <div class="fact-tag">Current discussion source</div>
        <div class="fact-title">River Ribble 2026 active thread</div>
        <div class="fact-text">
          The River Ribble 2026 discussion thread is the active public source to monitor for fresh salmon catch mentions, river-condition discussion, and angler observations.
        </div>
        <div class="fact-source">Source: Salmon Fishing Forum — River Ribble 2026</div>
      </div>

      <div class="fact">
        <div class="fact-tag">30 Jan 2026 · river condition</div>
        <div class="fact-title">Good steady height reported, but likely still early</div>
        <div class="fact-text">
          River Ribble 2026 discussion described the river as a good steady height while noting it was probably still early for reliable salmon catches.
        </div>
        <div class="fact-source">Source: Salmon Fishing Forum — River Ribble 2026</div>
      </div>

      <div class="fact">
        <div class="fact-tag">Catch reporting status</div>
        <div class="fact-title">No live official catch-return feed connected</div>
        <div class="fact-text">
          A live official salmon catch-return feed has not been found or connected. Future builds should use a backend JSON feed if automated daily catch intelligence is required.
        </div>
        <div class="fact-source">Status: frontend-only GitHub Pages app</div>
      </div>
    </section>
  `;
}

async function init(){
  const content = document.getElementById("content");

  try{
    const river = await getRiver();
    content.innerHTML = renderLive(river) + renderIntel();
  }catch(e){
    content.innerHTML = `
      <section class="card">
        <div class="card-title">Live Henthorn Conditions</div>
        <div class="source">Environment Agency station 710305</div>
        <div class="notice">Live data unavailable: ${e.message}</div>
      </section>
      ${renderIntel()}
    `;
  }
}

setInterval(init,300000);
init();
</script>
</body>
</html>
