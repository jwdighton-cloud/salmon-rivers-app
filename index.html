<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salmon Rivers</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2f5;
  margin: 0;
  padding: 12px;
}

h1 {
  text-align: center;
}

.subtitle {
  text-align: center;
  font-size: 13px;
  color: #555;
  margin-bottom: 16px;
}

.river-card {
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 14px;
  background: white;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}

.river-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.status {
  font-size: 28px;
}

.buttons {
  margin-top: 8px;
}

.buttons button {
  margin-right: 6px;
  margin-top: 6px;
  padding: 6px 10px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
}

.fish { background: #c8f7c5; }
.check { background: #fff3b0; }
.avoid { background: #f7c5c5; }

.score {
  margin-top: 8px;
  padding: 8px;
  border-radius: 10px;
  font-weight: bold;
  background: #f4f6f8;
}

.meta {
  font-size: 12px;
  color: #555;
  margin-top: 4px;
}

.river-info {
  margin-top: 10px;
  padding: 10px;
  background: #f4f6f8;
  border-radius: 10px;
  font-size: 14px;
}

textarea {
  width: 100%;
  min-height: 70px;
  margin-top: 10px;
  padding: 8px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

.links {
  margin-top: 10px;
}
</style>
</head>

<body>

<h1>Salmon Rivers</h1>
<div class="subtitle">Private river intelligence dashboard</div>

<div id="app"></div>

<script>
const rivers = [
  { id:"ribble", name:"River Ribble" },
  { id:"tyne", name:"River Tyne" },
  { id:"eden", name:"River Eden" },
  { id:"tweed", name:"River Tweed" },
  { id:"spey", name:"River Spey" },
  { id:"dee", name:"River Dee" },
  { id:"tay", name:"River Tay" },
  { id:"wye", name:"River Wye" }
];

function confidenceFromTime(time) {
  if (!time) return "NO UPDATE";
  const diff = (new Date() - new Date(time)) / (1000*60*60);
  if (diff > 24) return "LOW";
  if (diff > 6) return "MEDIUM";
  return "HIGH";
}

function fishability(status, confidence) {
  if (!status) return "⚪ No decision";
  if (status==="🔴") return "🔴 Avoid";
  if (status==="🟡") return confidence==="HIGH" ? "🟡 Possible" : "🟠 Check";
  if (status==="🟢") return confidence==="HIGH" ? "🟢 Good" : "🟡 Check";
}

function setStatus(river, status) {
  const now = new Date().toLocaleString();
  localStorage.setItem(`${river}-status`, status);
  localStorage.setItem(`${river}-time`, now);
  render();
}

function render() {
  const app = document.getElementById("app");

  app.innerHTML = rivers.map(r => {
    const status = localStorage.getItem(`${r.id}-status`) || "";
    const time = localStorage.getItem(`${r.id}-time`);
    const notes = localStorage.getItem(`${r.id}-notes`) || "";
    const conf = confidenceFromTime(time);
    const score = fishability(status, conf);

    return `
    <div class="river-card">
      <div class="river-title">
        <h2>${r.name}</h2>
        <div class="status">${status || "⚪"}</div>
      </div>

      <div class="buttons">
        <button class="fish" onclick="setStatus('${r.id}','🟢')">🟢 Fish</button>
        <button class="check" onclick="setStatus('${r.id}','🟡')">🟡 Check</button>
        <button class="avoid" onclick="setStatus('${r.id}','🔴')">🔴 Avoid</button>
      </div>

      <div class="score">${score}</div>

      <div class="meta">
        ${time ? `Updated: ${time} | Confidence: ${conf}` : "No update yet"}
      </div>

      <textarea placeholder="Notes..." 
        oninput="localStorage.setItem('${r.id}-notes',this.value)">${notes}</textarea>
    </div>`;
  }).join("");
}

render();
</script>

</body>
</html>
