<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salmon Rivers Intelligence</title>

<style>
body {font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f5f6f7;color:#111;}
h1 {text-align:center;margin:20px 0;font-size:28px;}
.tabs {display:flex;justify-content:center;gap:10px;margin-bottom:20px;}
.tab {padding:10px 16px;border-radius:20px;background:#e5e5e5;cursor:pointer;}
.tab.active {background:#cfe8cf;border:2px solid #4caf50;}
.container {max-width:600px;margin:auto;padding:10px;}
.card {background:#fff;border-radius:20px;padding:16px;margin-bottom:20px;box-shadow:0 4px 10px rgba(0,0,0,0.05);}
.section {background:#f0f0f0;border-radius:16px;padding:12px;margin-top:12px;}
.section h3 {margin:0 0 8px;}
.pill {display:inline-block;padding:6px 12px;border-radius:20px;background:#ddd;margin:4px;}
.good {background:#c8e6c9;}
.ok {background:#fff3cd;}
.bad {background:#ffcdd2;}
.small {font-size:13px;color:#555;line-height:1.5;}
a {text-decoration:none;color:#1a0dab;font-weight:500;}
</style>
</head>

<body>

<h1>Salmon Rivers Intelligence</h1>

<div class="tabs">
  <div class="tab active" onclick="showCountry('uk', this)">🇬🇧 UK</div>
  <div class="tab" onclick="showCountry('norway', this)">🇳🇴 Norway</div>
  <div class="tab" onclick="showCountry('iceland', this)">🇮🇸 Iceland</div>
</div>

<div class="container" id="content"></div>

<script>
const HENTHORN_URL = "https://environment.data.gov.uk/flood-monitoring/id/stations/710305/readings?_sorted&_limit=8";

async function getHenthornData() {
  try {
    const res = await fetch(HENTHORN_URL, { cache: "no-store" });
    const data = await res.json();

    if (!data.items || data.items.length === 0) {
      return { level:null, time:null, trend:"Unavailable" };
    }

    const readings = data.items
      .map(r => ({ value:Number(r.value), time:r.dateTime }))
      .filter(r => !isNaN(r.value))
      .sort((a,b) => new Date(b.time) - new Date(a.time));

    const latest = readings[0];
    const oldest = readings[readings.length - 1];

    let trend = "Steady";
    if (latest && oldest) {
      const diff = latest.value - oldest.value;
      if (diff > 0.03) trend = "Rising";
      if (diff < -0.03) trend = "Falling";
    }

    return {
      level: latest.value,
      time: latest.time,
      trend: trend
    };

  } catch (e) {
    return { level:null, time:null, trend:"Unavailable" };
  }
}

function getFishability(level, trend) {
  if (level === null) return {text:"Unknown",class:"ok"};

  if (level < 0.3) return {text:"Too Low",class:"bad"};
  if (level < 0.7 && trend !== "Rising") return {text:"Good",class:"good"};
  if (level < 0.9) return {text:"Good / Watch Trend",class:"good"};
  if (level < 1.2) return {text:"High but Fishable",class:"ok"};
  return {text:"Too High",class:"bad"};
}

function formatTime(dt) {
  if (!dt) return "No timestamp";
  return new Date(dt).toLocaleString("en-GB");
}

async function showCountry(country, el) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');

  const content = document.getElementById('content');

  if (country === 'uk') {
    content.innerHTML = `
      <div class="card">
        <h2>River Ribble @ Henthorn</h2>
        <div class="section"><h3>Loading live data...</h3></div>
      </div>
    `;

    const data = await getHenthornData();
    const fish = getFishability(data.level, data.trend);

    content.innerHTML = `
      <div class="card">
        <h2>River Ribble @ Henthorn</h2>

        <div class="section">
          <h3>🎯 Fishability</h3>
          <span class="pill ${fish.class}">${fish.text}</span>
        </div>

        <div class="section">
          <h3>🌊 River Level</h3>
          <span class="pill ${data.level !== null ? "good" : "bad"}">
            ${data.level !== null ? data.level.toFixed(2)+" m" : "Unavailable"}
          </span>
          <span class="pill ok">${data.trend}</span>
          <div class="small">
            Gauge: Ribble @ Henthorn<br>
            Updated: ${formatTime(data.time)}
          </div>
        </div>

        <div class="section">
          <h3>🌡 Temperature</h3>
          <span class="pill">Next step</span>
        </div>

        <div class="section">
          <h3>🌦 Weather</h3>
          <a href="https://www.metoffice.gov.uk/" target="_blank">Met Office</a>
        </div>

        <div class="section">
          <h3>🎣 Operator Intel</h3>
          <span class="pill good"><a href="https://ribblefishing.co.uk/" target="_blank">RFCA</a></span>
        </div>
      </div>
    `;
  }

  if (country === 'norway') {
    content.innerHTML = `<div class="card"><h2>River Gaula</h2><p>Next step</p></div>`;
  }

  if (country === 'iceland') {
    content.innerHTML = `<div class="card"><h2>East Rangá</h2><p>Next step</p></div>`;
  }
}

showCountry('uk', document.querySelector('.tab'));
</script>

</body>
</html>
