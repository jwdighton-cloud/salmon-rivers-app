<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salmon Rivers</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2f5;
  margin: 0;
  padding: 12px;
}

h1 { text-align: center; }

.subtitle {
  text-align: center;
  font-size: 13px;
  color: #555;
  margin-bottom: 16px;
}

.summary-panel,
.river-card {
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 14px;
  background: white;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}

/* 🔥 NEW: dynamic banner colours */
.best-banner {
  border-radius: 14px;
  padding: 12px;
  margin-bottom: 14px;
  font-weight: bold;
}

.banner-good {
  background: #dff8df;
  border: 2px solid #6ac96a;
}

.banner-check {
  background: #fff6cc;
  border: 2px solid #e0c24a;
}

.banner-avoid {
  background: #ffd6d6;
  border: 2px solid #d66;
}

.best-card {
  border: 2px solid #6ac96a;
}

.best-label {
  display: inline-block;
  margin-bottom: 8px;
  padding: 5px 8px;
  border-radius: 999px;
  background: #dff8df;
  font-size: 13px;
  font-weight: bold;
}

.summary-panel h2 { margin-top: 0; }

.summary-item {
  padding: 6px 0;
  border-bottom: 1px solid #e2e6ea;
  font-size: 14px;
}

.summary-item:last-child { border-bottom: none; }

.river-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.status { font-size: 28px; }

.buttons { margin-top: 8px; }

.buttons button {
  margin-right: 6px;
  margin-top: 6px;
  padding: 7px 11px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-size: 14px;
}

.fish { background: #c8f7c5; }
.check { background: #fff3b0; }
.avoid { background: #f7c5c5; }

.score,
.trend {
  margin-top: 8px;
  padding: 8px;
  border-radius: 10px;
  font-weight: bold;
  background: #f4f6f8;
}

.meta {
  font-size: 12px;
  color: #555;
  margin-top: 4px;
}

.history {
  margin-top: 10px;
  padding: 10px;
  background: #f7f9fb;
  border-radius: 10px;
  font-size: 13px;
}

.history-title {
  font-weight: bold;
  margin-bottom: 5px;
}

.history-item {
  padding: 3px 0;
  border-bottom: 1px solid #e2e6ea;
}

textarea {
  width: 100%;
  box-sizing: border-box;
  min-height: 70px;
  margin-top: 10px;
  padding: 8px;
  border-radius: 8px;
  border: 1px solid #ccc;
}
</style>
</head>

<body>

<h1>Salmon Rivers</h1>
<div class="subtitle">Private river intelligence dashboard</div>

<div id="summary"></div>
<div id="app"></div>

<script>
const rivers = [
  { id:"ribble", name:"River Ribble" },
  { id:"tyne", name:"River Tyne" },
  { id:"eden", name:"River Eden" },
  { id:"tweed", name:"River Tweed" },
  { id:"spey", name:"River Spey" },
  { id:"dee", name:"River Dee" },
  { id:"tay", name:"River Tay" },
  { id:"wye", name:"River Wye" }
];

function confidenceFromTime(time) {
  if (!time) return "NO UPDATE";
  const diff = (new Date() - new Date(time)) / (1000 * 60 * 60);
  if (diff > 24) return "LOW";
  if (diff > 6) return "MEDIUM";
  return "HIGH";
}

function statusValue(status) {
  if (status === "🔴") return 1;
  if (status === "🟡") return 2;
  if (status === "🟢") return 3;
  return 0;
}

function confidenceValue(confidence) {
  if (confidence === "HIGH") return 3;
  if (confidence === "MEDIUM") return 2;
  if (confidence === "LOW") return 1;
  return 0;
}

function fishability(status, confidence) {
  if (!status) return "⚪ No decision";
  if (status === "🔴") return "🔴 Avoid";
  if (status === "🟡") return confidence === "HIGH" ? "🟡 Possible" : "🟠 Check";
  if (status === "🟢") return confidence === "HIGH" ? "🟢 Good" : "🟡 Check";
}

function bannerClass(score) {
  if (score.includes("Good")) return "banner-good";
  if (score.includes("Possible") || score.includes("Check")) return "banner-check";
  if (score.includes("Avoid")) return "banner-avoid";
  return "banner-check";
}

function getHistory(riverId) {
  return JSON.parse(localStorage.getItem(`${riverId}-history`) || "[]");
}

function saveHistory(riverId, status, time) {
  const history = getHistory(riverId);
  history.unshift({ status, time });
  localStorage.setItem(`${riverId}-history`, JSON.stringify(history.slice(0,3)));
}

function trendFromHistory(riverId) {
  const h = getHistory(riverId);
  if (h.length < 2) return "⚪ Trend: not enough history";
  const v = s => s==="🟢"?3:s==="🟡"?2:1;
  if (v(h[0].status)>v(h[1].status)) return "📈 Trend: improving";
  if (v(h[0].status)<v(h[1].status)) return "📉 Trend: worsening";
  return "➖ Trend: stable";
}

function setStatus(riverId, status) {
  const now = new Date().toLocaleString();
  localStorage.setItem(`${riverId}-status`, status);
  localStorage.setItem(`${riverId}-time`, now);
  saveHistory(riverId, status, now);
  render();
}

function snapshot(r) {
  const s = localStorage.getItem(`${r.id}-status`)||"";
  const t = localStorage.getItem(`${r.id}-time`);
  const c = confidenceFromTime(t);
  const sc = fishability(s,c);
  const tr = trendFromHistory(r.id);
  return {
    ...r,
    status:s||"⚪",
    time:t,
    confidence:c,
    score:sc,
    trend:tr,
    rank:(statusValue(s)*10)+(confidenceValue(c)*3)+(tr.includes("improving")?2:tr.includes("worsening")?-1:1)
  };
}

function renderSummary() {
  const ranked = rivers.map(snapshot).sort((a,b)=>b.rank-a.rank);
  const best = ranked[0];

  document.getElementById("summary").innerHTML = `
    <div class="best-banner ${bannerClass(best.score)}">
      ⭐ Best right now: ${best.name}<br>
      ${best.score} · ${best.trend.replace("Trend: ","")} · Confidence: ${best.confidence}
    </div>
  `;
}

function renderApp() {
  const ranked = rivers.map(snapshot).sort((a,b)=>b.rank-a.rank);
  const bestId = ranked[0].id;

  document.getElementById("app").innerHTML = ranked.map(r=>`
    <div class="river-card ${r.id===bestId?'best-card':''}">
      ${r.id===bestId?'<div class="best-label">⭐ Current #1 river</div>':''}
      <div class="river-title">
        <h2>${r.name}</h2>
        <div class="status">${r.status}</div>
      </div>

      <div class="buttons">
        <button class="fish" onclick="setStatus('${r.id}','🟢')">🟢 Fish</button>
        <button class="check" onclick="setStatus('${r.id}','🟡')">🟡 Check</button>
        <button class="avoid" onclick="setStatus('${r.id}','🔴')">🔴 Avoid</button>
      </div>

      <div class="score">${r.score}</div>
      <div class="trend">${r.trend}</div>

      <div class="meta">
        ${r.time?`Updated: ${r.time} | Confidence: ${r.confidence}`:"No update yet"}
      </div>

      <textarea placeholder="Notes..." 
        oninput="localStorage.setItem('${r.id}-notes',this.value)">
        ${localStorage.getItem(r.id+"-notes")||""}
      </textarea>
    </div>
  `).join("");
}

function render(){
  renderSummary();
  renderApp();
}

render();
</script>

</body>
</html>
