<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salmon Rivers Intelligence</title>

<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#eef3f5;color:#111;}
.app{max-width:680px;margin:auto;padding:16px;}

.header{
  background:linear-gradient(135deg,#0b2f3a,#0f4c5c);
  color:white;
  border-radius:26px;
  padding:20px;
  margin-bottom:16px;
}
.brand{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#cde6ec;font-weight:700;}
.header h1{margin:6px 0;font-size:32px;}
.sub{color:#cde6ec;font-size:14px;}

.card{
  background:white;
  border-radius:22px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.level{font-size:64px;font-weight:900;}
.unit{font-size:20px;color:#666;}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.chip{padding:6px 10px;border-radius:999px;font-weight:800;font-size:13px;}
.green{background:#d7f2d8;}
.blue{background:#dcecf4;}
.gold{background:#fff2cc;}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.stat{background:#f2f6f7;border-radius:16px;padding:12px;}
.stat-label{font-size:12px;color:#666;}
.stat-value{font-size:18px;font-weight:900;}

.notice{
  margin-top:12px;
  background:#fff8e7;
  border-left:4px solid #d9a441;
  padding:12px;
  border-radius:14px;
  font-size:13px;
}

.report{
  background:#f2f6f7;
  border-radius:16px;
  padding:12px;
  margin-top:10px;
}

.report-date{font-size:12px;color:#666;font-weight:700;}
.report-title{font-weight:900;margin:4px 0;}
.report-text{font-size:14px;color:#333;}
</style>
</head>

<body>
<div class="app">

<div class="header">
  <div class="brand">Salmon Rivers Intelligence</div>
  <h1>Ribble at Henthorn</h1>
  <div class="sub">Live river conditions · current-season salmon intelligence</div>
</div>

<div id="content"></div>

</div>

<script>

const EA_LATEST="https://environment.data.gov.uk/flood-monitoring/id/stations/710305/readings?latest";
const EA_RECENT="https://environment.data.gov.uk/flood-monitoring/id/stations/710305/readings?_sorted&_limit=12";

function safe(v){return v==null||isNaN(v)?"—":Number(v).toFixed(2);}
function age(t){const m=Math.round((Date.now()-new Date(t))/60000);return m<60?m+" min":Math.round(m/60)+" hr";}
function trend(m){if(m>0.02)return"Rising";if(m<-0.02)return"Falling";return"Steady";}

async function getRiver(){
  const l=await fetch(EA_LATEST).then(r=>r.json());
  const r=await fetch(EA_RECENT).then(r=>r.json());

  const level=l.items[0].value;
  const time=l.items[0].dateTime;

  let move=0;
  if(r.items.length>1){
    move=r.items[r.items.length-1].value-r.items[0].value;
  }

  return{level,time,move};
}

function render(r){
return`
<div class="card">
  <div class="level">${safe(r.level)}<span class="unit"> m</span></div>

  <div class="chips">
    <div class="chip green">${trend(r.move)}</div>
    <div class="chip blue">${age(r.time)}</div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">Movement</div>
      <div class="stat-value">${safe(r.move)} m</div>
    </div>

    <div class="stat">
      <div class="stat-label">Updated</div>
      <div class="stat-value">${new Date(r.time).toLocaleTimeString()}</div>
    </div>

    <div class="stat">
      <div class="stat-label">Water temperature</div>
      <div class="stat-value">Not available</div>
    </div>

    <div class="stat">
      <div class="stat-label">Rainfall</div>
      <div class="stat-value">Not verified</div>
    </div>
  </div>

  <div class="notice">
    Only verified data is shown. Water temperature and rainfall will appear when a trusted live source is connected.
  </div>
</div>

<div class="card">
  <h3>Ribble Salmon Intelligence (Current)</h3>

  <div class="report">
    <div class="report-date">Week commencing 13 Apr 2026</div>
    <div class="report-title">Catch signal across the catchment</div>
    <div class="report-text">
      Fish reported continuing to be caught across the Ribble catchment.
    </div>
  </div>

  <div class="report">
    <div class="report-date">2026 season</div>
    <div class="report-title">Active river intelligence thread</div>
    <div class="report-text">
      Ongoing angler discussion monitoring Ribble levels, conditions and early-season activity.
    </div>
  </div>

  <div class="report">
    <div class="report-date">Recent pattern</div>
    <div class="report-title">Fish movement behaviour</div>
    <div class="report-text">
      Ribble salmon movement strongly linked to fresh water. Activity increases following rises after rain.
    </div>
  </div>

  <div class="report">
    <div class="report-date">Season timing</div>
    <div class="report-title">Run characteristics</div>
    <div class="report-text">
      Ribble is a later-running river, with stronger activity typically building through summer into autumn.
    </div>
  </div>

</div>
`;
}

async function init(){
  const r=await getRiver();
  document.getElementById("content").innerHTML=render(r);
}

setInterval(init,300000);
init();

</script>

</body>
</html>
