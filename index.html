<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salmon Rivers</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2f5;
  margin: 0;
  padding: 16px;
}

h1 { text-align: center; }

.subtitle {
  text-align: center;
  font-size: 13px;
  color: #555;
  margin-bottom: 20px;
}

.summary-panel,
.river-card {
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 18px;
  background: white;
  box-shadow: 0 3px 10px rgba(0,0,0,0.12);
}

/* Banner */
.best-banner {
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 18px;
  font-weight: bold;
}

.banner-good { background:#dff8df; border:2px solid #6ac96a; }
.banner-check { background:#fff6cc; border:2px solid #e0c24a; }
.banner-avoid { background:#ffd6d6; border:2px solid #d66; }

/* 🔥 NEW: score colours */
.score-good { background:#e6f9e6; border:1px solid #6ac96a; }
.score-check { background:#fff7d9; border:1px solid #e0c24a; }
.score-avoid { background:#ffe0e0; border:1px solid #d66; }

.best-card { border:2px solid #6ac96a; }

.best-label {
  display:inline-block;
  margin-bottom:10px;
  padding:6px 10px;
  border-radius:999px;
  background:#dff8df;
  font-size:13px;
  font-weight:bold;
}

.river-title {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}

.status { font-size:30px; }

.buttons button {
  margin:6px 6px 0 0;
  padding:10px 14px;
  border-radius:10px;
  border:none;
  cursor:pointer;
}

.fish { background:#c8f7c5; }
.check { background:#fff3b0; }
.avoid { background:#f7c5c5; }

.score,
.trend {
  margin-top:10px;
  padding:10px;
  border-radius:12px;
  font-weight:bold;
}

.meta {
  font-size:12px;
  color:#555;
  margin-top:6px;
}

textarea {
  width:100%;
  min-height:80px;
  margin-top:12px;
  padding:10px;
  border-radius:10px;
  border:1px solid #ccc;
}
</style>
</head>

<body>

<h1>Salmon Rivers</h1>
<div class="subtitle">Private river intelligence dashboard</div>

<div id="summary"></div>
<div id="app"></div>

<script>
const rivers = [
  { id:"ribble", name:"River Ribble" },
  { id:"tyne", name:"River Tyne" },
  { id:"eden", name:"River Eden" },
  { id:"tweed", name:"River Tweed" },
  { id:"spey", name:"River Spey" },
  { id:"dee", name:"River Dee" },
  { id:"tay", name:"River Tay" },
  { id:"wye", name:"River Wye" }
];

function confidenceFromTime(t){
  if(!t) return "NO UPDATE";
  const d=(new Date()-new Date(t))/(1000*60*60);
  if(d>24) return "LOW";
  if(d>6) return "MEDIUM";
  return "HIGH";
}

function fishability(s,c){
  if(!s) return "⚪ No decision";
  if(s==="🔴") return "🔴 Avoid";
  if(s==="🟡") return c==="HIGH"?"🟡 Possible":"🟠 Check";
  if(s==="🟢") return c==="HIGH"?"🟢 Good":"🟡 Check";
}

function scoreClass(score){
  if(score.includes("Good")) return "score-good";
  if(score.includes("Possible")||score.includes("Check")) return "score-check";
  if(score.includes("Avoid")) return "score-avoid";
}

function bannerClass(score){
  if(score.includes("Good")) return "banner-good";
  if(score.includes("Check")||score.includes("Possible")) return "banner-check";
  if(score.includes("Avoid")) return "banner-avoid";
}

function setStatus(id,s){
  const now=new Date().toLocaleString();
  localStorage.setItem(id+"-status",s);
  localStorage.setItem(id+"-time",now);
  render();
}

function snap(r){
  const s=localStorage.getItem(r.id+"-status")||"";
  const t=localStorage.getItem(r.id+"-time");
  const c=confidenceFromTime(t);
  const sc=fishability(s,c);
  return {...r,status:s||"⚪",time:t,confidence:c,score:sc};
}

function render(){
  const ranked=rivers.map(snap);

  const best=ranked[0];

  document.getElementById("summary").innerHTML=`
    <div class="best-banner ${bannerClass(best.score)}">
      ⭐ Best right now: ${best.name}<br>
      ${best.score}
    </div>
  `;

  document.getElementById("app").innerHTML=ranked.map(r=>`
    <div class="river-card">
      <div class="river-title">
        <h2>${r.name}</h2>
        <div class="status">${r.status}</div>
      </div>

      <div class="buttons">
        <button class="fish" onclick="setStatus('${r.id}','🟢')">🟢 Fish</button>
        <button class="check" onclick="setStatus('${r.id}','🟡')">🟡 Check</button>
        <button class="avoid" onclick="setStatus('${r.id}','🔴')">🔴 Avoid</button>
      </div>

      <div class="score ${scoreClass(r.score)}">${r.score}</div>

      <div class="meta">
        ${r.time?`Updated: ${r.time} | Confidence: ${r.confidence}`:"No update yet"}
      </div>

      <textarea placeholder="Notes..." 
        oninput="localStorage.setItem('${r.id}-notes',this.value)">
        ${localStorage.getItem(r.id+"-notes")||""}
      </textarea>
    </div>
  `).join("");
}

render();
</script>

</body>
</html>
