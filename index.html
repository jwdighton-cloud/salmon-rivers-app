<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salmon Rivers Intelligence</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2f5;
  margin: 0;
  padding: 16px;
}

h1 {
  text-align: center;
  margin-bottom: 6px;
}

.subtitle {
  text-align: center;
  font-size: 13px;
  color: #555;
  margin-bottom: 20px;
}

.intel-panel,
.river-card {
  background: white;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 18px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.12);
}

.intel-panel {
  border: 2px solid #4f8fca;
  background: #eaf4ff;
}

.intel-panel h2 {
  margin-top: 0;
}

.country-label {
  font-size: 12px;
  font-weight: bold;
  color: #555;
  margin-bottom: 4px;
}

.river-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.river-title h2 {
  margin: 4px 0 10px 0;
}

.source-status {
  font-size: 12px;
  padding: 5px 8px;
  border-radius: 999px;
  background: #fff6cc;
  border: 1px solid #e0c24a;
  font-weight: bold;
}

.data-block {
  background: #f7f9fb;
  border-radius: 12px;
  padding: 12px;
  margin-top: 12px;
}

.data-block h3 {
  margin-top: 0;
  margin-bottom: 8px;
  font-size: 15px;
}

.data-row {
  padding: 6px 0;
  border-bottom: 1px solid #e2e6ea;
  font-size: 14px;
  line-height: 1.4;
}

.data-row:last-child {
  border-bottom: none;
}

.links {
  margin-top: 12px;
}

.links a {
  display: inline-block;
  margin: 6px 6px 0 0;
  padding: 8px 10px;
  border-radius: 10px;
  background: #eef2f5;
  color: #064f8f;
  text-decoration: none;
  font-size: 14px;
  font-weight: bold;
}

.links a:hover {
  text-decoration: underline;
}

.note-box {
  margin-top: 12px;
}

.note-box label {
  font-size: 13px;
  font-weight: bold;
}

textarea {
  width: 100%;
  box-sizing: border-box;
  min-height: 70px;
  margin-top: 6px;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 14px;
  font-family: Arial, sans-serif;
}

.warning {
  background: #fff7d9;
  border: 1px solid #e0c24a;
  border-radius: 12px;
  padding: 10px;
  margin-top: 12px;
  font-size: 13px;
  line-height: 1.4;
}

.small {
  font-size: 12px;
  color: #666;
}
</style>
</head>

<body>

<h1>Salmon Rivers Intelligence</h1>
<div class="subtitle">External-data-led salmon fishing dashboard</div>

<div class="intel-panel">
  <h2>Current Build Purpose</h2>
  <div class="data-row"><strong>Primary aim:</strong> outside river intelligence first</div>
  <div class="data-row"><strong>Manual input:</strong> notes only, secondary</div>
  <div class="data-row"><strong>Next technical step:</strong> connect official live feeds one source at a time</div>
</div>

<div id="app"></div>

<script>
const rivers = [
  {
    id: "ribble",
    country: "UK — England",
    name: "River Ribble",
    mainIntel: "High-priority local river. Temperature, rainfall, colour and level changes matter strongly.",
    dataSources: [
      ["Water level", "Environment Agency station data / source mapping required"],
      ["Water temperature", "RFCA / sonde data where available"],
      ["Weather", "Met Office / BBC weather link"],
      ["Rainfall", "EA / Met Office source mapping required"],
      ["Catch reports", "Google search / local reports"]
    ],
    links: [
      ["Catch reports", "https://www.google.com/search?q=river+ribble+salmon+fishing+report"],
      ["Weather", "https://www.bbc.co.uk/weather"],
      ["RFCA", "https://ribbletrust.org.uk/"],
      ["EA river levels search", "https://check-for-flooding.service.gov.uk/river-and-sea-levels"]
    ]
  },
  {
    id: "tyne",
    country: "UK — England",
    name: "River Tyne",
    mainIntel: "Major salmon system. Level, recent rainfall, tributary conditions and fish movement are key.",
    dataSources: [
      ["Water level", "Environment Agency station data / source mapping required"],
      ["Flow", "EA hydrology source mapping required"],
      ["Weather", "Met Office / BBC weather link"],
      ["Rainfall", "EA / Met Office source mapping required"],
      ["Catch reports", "Google search / fishery reports"]
    ],
    links: [
      ["Catch reports", "https://www.google.com/search?q=river+tyne+salmon+fishing+report"],
      ["Weather", "https://www.bbc.co.uk/weather"],
      ["EA river levels search", "https://check-for-flooding.service.gov.uk/river-and-sea-levels"]
    ]
  },
  {
    id: "eden",
    country: "UK — England",
    name: "River Eden",
    mainIntel: "Clear-water system. Height, clarity and recent rain are especially important.",
    dataSources: [
      ["Water level", "Environment Agency station data / source mapping required"],
      ["Flow", "EA hydrology source mapping required"],
      ["Weather", "Met Office / BBC weather link"],
      ["Rainfall", "EA / Met Office source mapping required"],
      ["Catch reports", "Google search / fishery reports"]
    ],
    links: [
      ["Catch reports", "https://www.google.com/search?q=river+eden+salmon+fishing+report"],
      ["Weather", "https://www.bbc.co.uk/weather"],
      ["EA river levels search", "https://check-for-flooding.service.gov.uk/river-and-sea-levels"]
    ]
  },
  {
    id: "wye",
    country: "UK — England/Wales",
    name: "River Wye",
    mainIntel: "Large river where rain, level, colour and temperature can change fishing prospects quickly.",
    dataSources: [
      ["Water level", "EA / Natural Resources Wales source mapping required"],
      ["Flow", "Official hydrology source mapping required"],
      ["Weather", "Met Office / BBC weather link"],
      ["Rainfall", "Official rainfall source mapping required"],
      ["Catch reports", "Google search / local reports"]
    ],
    links: [
      ["Catch reports", "https://www.google.com/search?q=river+wye+salmon+fishing+report"],
      ["Weather", "https://www.bbc.co.uk/weather"],
      ["EA river levels search", "https://check-for-flooding.service.gov.uk/river-and-sea-levels"]
    ]
  },
  {
    id: "tweed",
    country: "UK — Scotland",
    name: "River Tweed",
    mainIntel: "Major Scottish salmon river. Beat conditions, levels and recent rainfall are central.",
    dataSources: [
      ["Water level", "SEPA / river level source mapping required"],
      ["Flow", "SEPA hydrometric source mapping required"],
      ["Weather", "Met Office / BBC weather link"],
      ["Rainfall", "SEPA / Met Office source mapping required"],
      ["Catch reports", "Google search / beat reports"]
    ],
    links: [
      ["Catch reports", "https://www.google.com/search?q=river+tweed+salmon+fishing+report"],
      ["Weather", "https://www.bbc.co.uk/weather"],
      ["SEPA water levels", "https://beta.sepa.scot/flooding/water-level-data/"]
    ]
  },
  {
    id: "spey",
    country: "UK — Scotland",
    name: "River Spey",
    mainIntel: "Fast-flowing river. Height, clarity, temperature and recent rain are key indicators.",
    dataSources: [
      ["Water level", "SEPA / river level source mapping required"],
      ["Flow", "SEPA hydrometric source mapping required"],
      ["Weather", "Met Office / BBC weather link"],
      ["Rainfall", "SEPA / Met Office source mapping required"],
      ["Catch reports", "Google search / fishery reports"]
    ],
    links: [
      ["Catch reports", "https://www.google.com/search?q=river+spey+salmon+fishing+report"],
      ["Weather", "https://www.bbc.co.uk/weather"],
      ["SEPA water levels", "https://beta.sepa.scot/flooding/water-level-data/"]
    ]
  },
  {
    id: "dee",
    country: "UK — Scotland",
    name: "River Dee",
    mainIntel: "Important salmon river. Cooler conditions, river height and fresh fish movement matter.",
    dataSources: [
      ["Water level", "SEPA / river level source mapping required"],
      ["Flow", "SEPA hydrometric source mapping required"],
      ["Weather", "Met Office / BBC weather link"],
      ["Rainfall", "SEPA / Met Office source mapping required"],
      ["Catch reports", "Google search / fishery reports"]
    ],
    links: [
      ["Catch reports", "https://www.google.com/search?q=river+dee+aberdeenshire+salmon+fishing+report"],
      ["Weather", "https://www.bbc.co.uk/weather"],
      ["SEPA water levels", "https://beta.sepa.scot/flooding/water-level-data/"]
    ]
  },
  {
    id: "tay",
    country: "UK — Scotland",
    name: "River Tay",
    mainIntel: "Large river. Water height, flow and fish movement across beats are the main intelligence points.",
    dataSources: [
      ["Water level", "SEPA / river level source mapping required"],
      ["Flow", "SEPA hydrometric source mapping required"],
      ["Weather", "Met Office / BBC weather link"],
      ["Rainfall", "SEPA / Met Office source mapping required"],
      ["Catch reports", "Google search / beat reports"]
    ],
    links: [
      ["Catch reports", "https://www.google.com/search?q=river+tay+salmon+fishing+report"],
      ["Weather", "https://www.bbc.co.uk/weather"],
      ["SEPA water levels", "https://beta.sepa.scot/flooding/water-level-data/"]
    ]
  },
  {
    id: "alta",
    country: "Norway",
    name: "Altaelva",
    mainIntel: "High-value Norwegian salmon river. Future integration should prioritise NVE hydrology, temperature and local reports.",
    dataSources: [
      ["Water level", "NVE HydAPI source mapping required"],
      ["Flow", "NVE HydAPI source mapping required"],
      ["Water temperature", "NVE HydAPI where available"],
      ["Weather", "Norwegian weather source mapping required"],
      ["Catch reports", "Local/search reports"]
    ],
    links: [
      ["Catch reports", "https://www.google.com/search?q=Altaelva+salmon+fishing+report"],
      ["NVE HydAPI", "https://hydapi.nve.no/"],
      ["Weather search", "https://www.google.com/search?q=Altaelva+weather"]
    ]
  },
  {
    id: "gaula",
    country: "Norway",
    name: "Gaula",
    mainIntel: "Major Norwegian salmon river. Level, flow, temperature and rainfall are priority data points.",
    dataSources: [
      ["Water level", "NVE HydAPI source mapping required"],
      ["Flow", "NVE HydAPI source mapping required"],
      ["Water temperature", "NVE HydAPI where available"],
      ["Weather", "Norwegian weather source mapping required"],
      ["Catch reports", "Local/search reports"]
    ],
    links: [
      ["Catch reports", "https://www.google.com/search?q=Gaula+Norway+salmon+fishing+report"],
      ["NVE HydAPI", "https://hydapi.nve.no/"],
      ["Weather search", "https://www.google.com/search?q=Gaula+Norway+weather"]
    ]
  },
  {
    id: "orkla",
    country: "Norway",
    name: "Orkla",
    mainIntel: "Important Norwegian salmon river. Hydrology and temperature are central to future live integration.",
    dataSources: [
      ["Water level", "NVE HydAPI source mapping required"],
      ["Flow", "NVE HydAPI source mapping required"],
      ["Water temperature", "NVE HydAPI where available"],
      ["Weather", "Norwegian weather source mapping required"],
      ["Catch reports", "Local/search reports"]
    ],
    links: [
      ["Catch reports", "https://www.google.com/search?q=Orkla+Norway+salmon+fishing+report"],
      ["NVE HydAPI", "https://hydapi.nve.no/"],
      ["Weather search", "https://www.google.com/search?q=Orkla+Norway+weather"]
    ]
  },
  {
    id: "blanda",
    country: "Iceland",
    name: "Blanda",
    mainIntel: "Iceland salmon river. Needs official source mapping before live feed integration.",
    dataSources: [
      ["Water level", "Iceland hydrology source mapping required"],
      ["Flow", "Iceland hydrology source mapping required"],
      ["Weather", "Icelandic weather source mapping required"],
      ["Catch reports", "Local/search reports"],
      ["Data status", "Research required before live integration"]
    ],
    links: [
      ["Catch reports", "https://www.google.com/search?q=Blanda+Iceland+salmon+fishing+report"],
      ["Iceland Met Office hydrology", "https://en.vedur.is/hydrology/"],
      ["Weather search", "https://www.google.com/search?q=Blanda+Iceland+weather"]
    ]
  },
  {
    id: "laxa",
    country: "Iceland",
    name: "Laxá",
    mainIntel: "Iceland salmon/trout system. Needs careful source mapping because river names repeat in Iceland.",
    dataSources: [
      ["Water level", "Iceland hydrology source mapping required"],
      ["Flow", "Iceland hydrology source mapping required"],
      ["Weather", "Icelandic weather source mapping required"],
      ["Catch reports", "Local/search reports"],
      ["Data status", "Research required before live integration"]
    ],
    links: [
      ["Catch reports", "https://www.google.com/search?q=Laxa+Iceland+salmon+fishing+report"],
      ["Iceland Met Office hydrology", "https://en.vedur.is/hydrology/"],
      ["Weather search", "https://www.google.com/search?q=Laxa+Iceland+weather"]
    ]
  }
];

function renderDataSources(items) {
  return items.map(item => `
    <div class="data-row">
      <strong>${item[0]}:</strong> ${item[1]}
    </div>
  `).join("");
}

function renderLinks(links) {
  return links.map(link => `
    <a href="${link[1]}" target="_blank" rel="noopener">${link[0]}</a>
  `).join("");
}

function renderApp() {
  const app = document.getElementById("app");

  app.innerHTML = rivers.map(river => {
    const savedNote = localStorage.getItem(`${river.id}-notes`) || "";

    return `
      <div class="river-card">
        <div class="country-label">${river.country}</div>

        <div class="river-title">
          <h2>${river.name}</h2>
          <div class="source-status">External data first</div>
        </div>

        <div class="data-block">
          <h3>River intelligence</h3>
          <div class="data-row">${river.mainIntel}</div>
        </div>

        <div class="data-block">
          <h3>External data targets</h3>
          ${renderDataSources(river.dataSources)}
        </div>

        <div class="data-block">
          <h3>Source links</h3>
          <div class="links">
            ${renderLinks(river.links)}
          </div>
        </div>

        <div class="warning">
          Live values are not yet pulled into the card. This build prepares the correct external-data structure before we connect official feeds.
        </div>

        <div class="note-box">
          <label>Your private note — optional</label>
          <textarea placeholder="Optional note..." oninput="localStorage.setItem('${river.id}-notes', this.value)">${savedNote}</textarea>
        </div>
      </div>
    `;
  }).join("");
}

renderApp();
</script>

</body>
</html>
